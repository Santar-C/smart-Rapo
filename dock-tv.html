<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Dock TV Display</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; overflow:hidden; background:#060a14; color:#fff; font-family:'Sarabun',Tahoma,Arial,sans-serif; }
    .tv-header { height:70px; background:#0b1120; border-bottom:2px solid #1e2d48; display:flex; align-items:center; justify-content:space-between; padding:0 1.5rem; flex-shrink:0; }
    .tv-logo   { width:36px; height:36px; background:#6366f1; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:1.1rem; margin-right:0.75rem; flex-shrink:0; }
    .tv-app-name { font-size:1.1rem; font-weight:900; letter-spacing:0.05em; }
    .tv-app-name span { color:#818cf8; }
    .tv-sub { font-size:0.72rem; color:#64748b; margin-top:2px; }
    .tv-clock { font-size:2.5rem; font-weight:900; color:#34d399; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
    .tv-clock-date { font-size:0.78rem; color:#64748b; text-align:right; margin-top:2px; }
    .tv-body { display:flex; height:calc(100vh - 70px); overflow:hidden; }
    .tv-left { flex:0 0 68%; border-right:2px solid #1e2d48; display:flex; flex-direction:column; overflow:hidden; }
    .tv-sec-hdr { padding:0.45rem 1.25rem; background:rgba(255,255,255,0.03); border-bottom:1px solid #1e2d48; font-size:0.78rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#94a3b8; flex-shrink:0; }
    .tv-dock-grid { flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:0.65rem; padding:0.65rem; overflow:hidden; align-content:start; }
    .tv-dock-card { border:1.5px solid #1e2d48; border-radius:12px; background:#0d1523; display:flex; flex-direction:column; overflow:hidden; }
    .tv-dock-card.occupied { border-color:#6366f1; background:#13193a; box-shadow:0 0 20px rgba(99,102,241,0.15); }
    .tv-dock-card.busy     { opacity:0.45; border-color:#374151; }
    .tv-dock-card.delay    { border-color:#ef4444; box-shadow:0 0 20px rgba(239,68,68,0.2); }
    @keyframes pulse-d { 0%,100%{opacity:1} 50%{opacity:0.55} }
    .delay-anim { animation:pulse-d 1s ease-in-out infinite; color:#f87171; }
    .tv-card-head { padding:0.4rem 0.75rem; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1e2d48; flex-shrink:0; }
    .tv-dock-name { font-size:1rem; font-weight:900; color:#e2e8f0; }
    .tv-status-pill { font-size:0.62rem; font-weight:700; padding:2px 7px; border-radius:10px; }
    .s-arrived    { background:#0e4429; color:#4ade80; }
    .s-loading    { background:#1e1b4b; color:#a5b4fc; }
    .s-waitingdoc { background:#431407; color:#fb923c; }
    .s-pending    { background:#1e2d48; color:#94a3b8; }
    .tv-card-body { padding:0.5rem 0.75rem; flex:1; display:flex; flex-direction:column; gap:2px; overflow:hidden; }
    .tv-license { font-size:1.5rem; font-weight:900; color:#fff; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tv-do      { font-size:0.72rem; color:#818cf8; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tv-vendor  { font-size:0.7rem; color:#64748b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tv-tags    { display:flex; gap:0.35rem; margin-top:auto; padding-top:3px; flex-wrap:wrap; }
    .tv-tag     { font-size:0.62rem; padding:2px 6px; border-radius:5px; font-weight:700; }
    .tag-v  { background:#1e2d48; color:#94a3b8; }
    .tag-in { background:#0c2340; color:#60a5fa; }
    .tag-out{ background:#2c1207; color:#fb923c; }
    .tv-card-foot { padding:0.35rem 0.75rem; background:rgba(255,255,255,0.03); border-top:1px solid #1e2d48; display:flex; justify-content:space-between; font-size:0.68rem; color:#64748b; flex-shrink:0; }
    .tv-empty-bay { padding:0.5rem 0.75rem; flex:1; display:flex; align-items:center; justify-content:center; color:#1e3a5f; font-weight:700; font-size:0.82rem; }
    .tv-right { flex:0 0 32%; display:flex; flex-direction:column; overflow:hidden; background:#080e1a; }
    .tv-wl-hdr { padding:0.45rem 1rem; background:rgba(251,191,36,0.06); border-bottom:1px solid rgba(251,191,36,0.15); font-size:0.78rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#fbbf24; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; }
    .wl-cnt { background:rgba(251,191,36,0.15); color:#fbbf24; padding:2px 8px; border-radius:10px; font-size:0.75rem; }
    .tv-wl-body { flex:1; overflow-y:auto; padding:0.5rem; }
    .tv-wl-body::-webkit-scrollbar { width:4px; }
    .tv-wl-body::-webkit-scrollbar-thumb { background:#1e2d48; border-radius:4px; }
    .wl-row { display:flex; align-items:center; gap:0.6rem; padding:0.55rem 0.75rem; border-radius:10px; background:#0d1523; border:1px solid #1e2d48; margin-bottom:0.45rem; }
    @keyframes slideIn { from{transform:translateX(-10px);opacity:0} to{transform:translateX(0);opacity:1} }
    .wl-row { animation:slideIn 0.4s ease; }
    .wl-num  { width:27px; height:27px; border-radius:50%; background:#1e2d48; display:flex; align-items:center; justify-content:center; font-size:0.82rem; font-weight:900; color:#94a3b8; flex-shrink:0; }
    .wl-info { flex:1; min-width:0; }
    .wl-lic  { font-size:0.95rem; font-weight:900; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .wl-do   { font-size:0.7rem; color:#818cf8; }
    .wl-target { font-size:0.65rem; color:#6366f1; font-weight:700; }
    .wl-time { font-size:0.95rem; font-weight:900; color:#fbbf24; flex-shrink:0; }
    .wl-type { font-size:0.62rem; font-weight:700; padding:2px 5px; border-radius:5px; flex-shrink:0; }
    .wl-in  { background:#0c2340; color:#60a5fa; }
    .wl-out { background:#2c1207; color:#fb923c; }
    .tv-empty-wl { padding:2rem 1rem; text-align:center; color:#1e3a5f; font-size:0.85rem; font-weight:700; }
    #status-dot { width:8px; height:8px; border-radius:50%; background:#ef4444; display:inline-block; margin-right:5px; }
    #status-dot.online  { background:#34d399; animation:none; }
    #status-dot.offline { animation:pulse-d 1s ease-in-out infinite; }
  </style>
</head>
<body>

<header class="tv-header">
  <div style="display:flex; align-items:center;">
    <div class="tv-logo">R</div>
    <div>
      <div class="tv-app-name">DOCK <span>QUEUE</span></div>
      <div class="tv-sub">
        <span id="status-dot" class="offline"></span>
        <span id="status-label">กำลังเชื่อมต่อ Firebase...</span>
        &nbsp;|&nbsp; 📅 <span id="view-date-lbl">—</span>
      </div>
    </div>
  </div>
  <div style="text-align:right;">
    <div class="tv-clock" id="tv-clock">00:00:00</div>
    <div class="tv-clock-date" id="tv-clock-date">—</div>
  </div>
</header>

<div class="tv-body">
  <div class="tv-left">
    <div class="tv-sec-hdr">⚡ Live Dock Board (สถานะหน้าท่า)</div>
    <div class="tv-dock-grid" id="dock-grid">
      <div style="color:#374151;font-size:0.9rem;padding:2rem;grid-column:1/-1;text-align:center;">⏳ กำลังโหลดข้อมูล...</div>
    </div>
  </div>
  <div class="tv-right">
    <div class="tv-wl-hdr">🅿️ Waitlist <span class="wl-cnt" id="wl-count">0</span></div>
    <div class="tv-wl-body" id="wl-body">
      <div class="tv-empty-wl">ไม่มีคิวรอ</div>
    </div>
  </div>
</div>

<script>
  // ══════════════════════════════════════════════════════════
  // Firebase Config — rapo-system (ถูกต้อง)
  // ══════════════════════════════════════════════════════════
  var firebaseConfig = {
    apiKey:            "AIzaSyCx2A8zmYI1GxvJY2-De6A7FPo1tgVRJk8",
    authDomain:        "rapo-system.firebaseapp.com",
    databaseURL:       "https://rapo-system-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:         "rapo-system",
    storageBucket:     "rapo-system.firebasestorage.app",
    messagingSenderId: "87090183469",
    appId:             "1:87090183469:web:eafb1ded183755f329a7a4"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var rtdb = firebase.database();

  // ── State ─────────────────────────────────────────────────
  var bays = [], bookings = {};
  var targetDate = new Date().toISOString().split("T")[0];

  // รับวันที่จาก URL ?date=YYYY-MM-DD
  var qs = window.location.search.substring(1).split("&");
  for (var i = 0; i < qs.length; i++) {
    var p = qs[i].split("=");
    if (p[0] === "date" && p[1]) targetDate = decodeURIComponent(p[1]);
  }
  document.getElementById("view-date-lbl").textContent = targetDate;

  // ── Clock ─────────────────────────────────────────────────
  var DAYS = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
  function tick() {
    var n = new Date();
    var hh = String(n.getHours()).padStart(2,"0");
    var mm = String(n.getMinutes()).padStart(2,"0");
    var ss = String(n.getSeconds()).padStart(2,"0");
    document.getElementById("tv-clock").textContent = hh+":"+mm+":"+ss;
    document.getElementById("tv-clock-date").textContent =
      "วัน"+DAYS[n.getDay()]+"ที่ "+n.getDate()+"/"+(n.getMonth()+1)+"/"+n.getFullYear();
  }
  setInterval(tick, 1000); tick();

  // ── Firebase Realtime Listeners ────────────────────────────
  rtdb.ref("smartdock/bays").on("value", function(snap) {
    var data = snap.val();
    if (!data) { bays = []; render(); return; }
    bays = Array.isArray(data)
      ? data.filter(Boolean)
      : Object.values(data).filter(Boolean);
    render();
  }, function(err) {
    document.getElementById("status-dot").className = "offline";
    document.getElementById("status-label").textContent = "❌ " + err.message;
  });

  rtdb.ref("smartdock/bookings").on("value", function(snap) {
    bookings = snap.val() || {};
    document.getElementById("status-dot").className = "online";
    document.getElementById("status-label").textContent = "🟢 ออนไลน์";
    render();
  }, function(err) {
    document.getElementById("status-dot").className = "offline";
    document.getElementById("status-label").textContent = "❌ " + err.message;
  });

  // ── Helpers ────────────────────────────────────────────────
  function allArr() {
    return Object.values(bookings).filter(Boolean);
  }
  function todayActive() {
    return allArr().filter(function(b) {
      return b.date === targetDate && b.status !== "Completed";
    });
  }
  function dockBook(name) {
    return todayActive().filter(function(b) { return b.allocation === name; });
  }
  function waitlistItems() {
    return todayActive().filter(function(b) { return b.allocation === "Waitlist"; });
  }
  function isDelay(b) {
    if (!b || b.status === "Completed" || b.status === "Pending") return false;
    var today = new Date().toISOString().split("T")[0];
    if (b.date !== today) return false;
    var n = new Date();
    var now = String(n.getHours()).padStart(2,"0") + ":" + String(n.getMinutes()).padStart(2,"0");
    return now > b.end_time;
  }

  var SL = { Pending:"รอเข้าท่า", Arrived:"รถมาถึง", Loading:"กำลังโหลด", WaitingDoc:"รอเอกสาร" };
  var SC = { Arrived:"s-arrived", Loading:"s-loading", WaitingDoc:"s-waitingdoc", Pending:"s-pending" };

  // ── Render ─────────────────────────────────────────────────
  function render() { renderDocks(); renderWaitlist(); }

  function renderDocks() {
    var grid = document.getElementById("dock-grid");
    if (!bays.length) {
      grid.innerHTML = '<div style="color:#374151;padding:2rem;grid-column:1/-1;text-align:center;">ยังไม่มีช่องจอด — กรุณาตั้งค่าใน dock.html</div>';
      return;
    }
    var html = "";
    for (var i = 0; i < bays.length; i++) {
      var bay = bays[i];
      var bl  = dockBook(bay.name);
      var b   = bl.length ? bl[0] : null;
      var delay = b && isDelay(b);
      var isBusy = (bay.status === "Busy" || bay.status === "Maintenance");
      var cls = b ? ("occupied" + (delay ? " delay" : "")) : (isBusy ? "busy" : "");

      html += '<div class="tv-dock-card ' + cls + '">';

      if (b) {
        if (delay) {
          html += '<div style="background:#7f1d1d;color:#fca5a5;font-size:0.62rem;font-weight:700;padding:3px;text-align:center;" class="delay-anim">⚠️ DELAY — เกินเวลา Plan</div>';
        }
        var sl = SL[b.status] || b.status;
        var sc = SC[b.status] || "s-pending";
        var ioTag = b.job_type === "OUT"
          ? '<span class="tv-tag tag-out">OUT</span>'
          : '<span class="tv-tag tag-in">IN</span>';

        html += '<div class="tv-card-head"><span class="tv-dock-name">' + bay.name + '</span><span class="tv-status-pill ' + sc + '">' + sl + '</span></div>';
        html += '<div class="tv-card-body">';
        html += '<div class="tv-do">' + (b.shipment_no || "") + '</div>';
        html += '<div class="tv-license">' + (b.license_plate || "") + '</div>';
        html += '<div class="tv-vendor">' + (b.vendor || "") + '</div>';
        html += '<div class="tv-tags"><span class="tv-tag tag-v">' + (b.vehicle || "—") + '</span>' + ioTag + '</div>';
        html += '</div>';
        html += '<div class="tv-card-foot"><span>Plan ออก: <b>' + b.end_time + '</b></span><span>มาถึง: <b>' + (b.time_arrived || "—") + '</b></span></div>';
      } else {
        html += '<div class="tv-card-head"><span class="tv-dock-name">' + bay.name + '</span>';
        html += isBusy
          ? '<span style="font-size:0.62rem;color:#ef4444;font-weight:700;">CLOSED</span>'
          : '<span style="font-size:0.62rem;color:#1e3a5f;font-weight:700;">EMPTY</span>';
        html += '</div>';
        html += '<div class="tv-empty-bay">' + (isBusy ? (bay.status === "Maintenance" ? "🔧 ซ่อมบำรุง" : "⚠️ ปิดชั่วคราว") : "✅ ว่าง") + '</div>';
      }
      html += '</div>';
    }
    grid.innerHTML = html;
  }

  function renderWaitlist() {
    var list = waitlistItems();
    document.getElementById("wl-count").textContent = list.length;
    var el = document.getElementById("wl-body");
    if (!list.length) {
      el.innerHTML = '<div class="tv-empty-wl">ไม่มีคิวรอในระบบ</div>';
      return;
    }
    var html = "";
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      var ic = b.job_type === "OUT" ? "wl-out" : "wl-in";
      var it = b.job_type === "OUT" ? "OUT" : "IN";
      html += '<div class="wl-row">';
      html += '<div class="wl-num">' + (i + 1) + '</div>';
      html += '<div class="wl-info">';
      html += '<div class="wl-lic">' + (b.license_plate || "") + '</div>';
      html += '<div class="wl-do">' + (b.shipment_no || "") + '</div>';
      if (b.target_dock) html += '<div class="wl-target">รอ ' + b.target_dock + '</div>';
      html += '</div>';
      html += '<span class="wl-type ' + ic + '">' + it + '</span>';
      html += '<div class="wl-time">' + (b.start_time || "") + '</div>';
      html += '</div>';
    }
    el.innerHTML = html;
  }

  // ── Auto-scroll Waitlist ───────────────────────────────────
  var scrollDir = 1;
  setInterval(function() {
    var el = document.getElementById("wl-body");
    if (el.scrollHeight <= el.clientHeight) return;
    el.scrollTop += scrollDir;
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 2) {
      scrollDir = -1;
      setTimeout(function() { scrollDir = 1; }, 2500);
    }
    if (el.scrollTop <= 0) scrollDir = 1;
  }, 40);

  // ── Auto-reload ทุก 2 ชั่วโมง ─────────────────────────────
  setTimeout(function() { window.location.reload(); }, 2 * 60 * 60 * 1000);
</script>
</body>
</html>

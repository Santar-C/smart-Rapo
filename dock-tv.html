<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Dock TV Display</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;background:#060a14;color:#fff;font-family:'Sarabun',Tahoma,Arial,sans-serif}
    .hdr{height:70px;background:#0b1120;border-bottom:2px solid #1e2d48;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;flex-shrink:0}
    .logo{width:36px;height:36px;background:#6366f1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1rem;margin-right:.75rem;flex-shrink:0}
    .app-name{font-size:1.1rem;font-weight:900;letter-spacing:.05em}
    .app-name span{color:#818cf8}
    .sub{font-size:.72rem;color:#64748b;margin-top:2px}
    .clock{font-size:2.5rem;font-weight:900;color:#34d399;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
    .clock-date{font-size:.78rem;color:#64748b;text-align:right;margin-top:2px}
    .body{display:flex;height:calc(100vh - 70px);overflow:hidden}
    /* LEFT */
    .left{flex:0 0 68%;border-right:2px solid #1e2d48;display:flex;flex-direction:column;overflow:hidden}
    .sec-hdr{padding:.45rem 1.25rem;background:rgba(255,255,255,.03);border-bottom:1px solid #1e2d48;font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#94a3b8;flex-shrink:0}
    .dock-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:.65rem;padding:.65rem;overflow:hidden;align-content:start}
    /* Dock Card */
    .dc{border:1.5px solid #1e2d48;border-radius:12px;background:#0d1523;display:flex;flex-direction:column;overflow:hidden}
    .dc.occ{border-color:#6366f1;background:#13193a;box-shadow:0 0 20px rgba(99,102,241,.15)}
    .dc.busy{opacity:.45;border-color:#374151}
    .dc.delay{border-color:#ef4444;box-shadow:0 0 20px rgba(239,68,68,.2)}
    @keyframes pd{0%,100%{opacity:1}50%{opacity:.55}} .da{animation:pd 1s ease-in-out infinite;color:#f87171}
    .dc-head{padding:.4rem .75rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e2d48;flex-shrink:0}
    .dn{font-size:1rem;font-weight:900;color:#e2e8f0}
    .sp{font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:10px}
    .s-arr{background:#0e4429;color:#4ade80} .s-ld{background:#1e1b4b;color:#a5b4fc}
    .s-wd{background:#431407;color:#fb923c} .s-pnd{background:#1e2d48;color:#94a3b8}
    .dc-body{padding:.5rem .75rem;flex:1;display:flex;flex-direction:column;gap:2px;overflow:hidden}
    .t-lic{font-size:.85rem;font-weight:700;color:#93c5fd;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .t-do{font-size:.8rem;color:#a5b4fc;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
    .t-do-num{font-size:1.4rem;color:#fff;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
    .t-do-label{font-size:.58rem;color:#818cf8;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
    .t-ven{font-size:.7rem;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tags{display:flex;gap:.35rem;margin-top:auto;padding-top:3px;flex-wrap:wrap}
    .tag{font-size:.62rem;padding:2px 6px;border-radius:5px;font-weight:700}
    .tv{background:#1e2d48;color:#94a3b8} .ti{background:#0c2340;color:#60a5fa} .to{background:#2c1207;color:#fb923c}
    .dc-foot{padding:.35rem .75rem;background:rgba(255,255,255,.03);border-top:1px solid #1e2d48;display:flex;justify-content:space-between;font-size:.68rem;color:#64748b;flex-shrink:0}
    .empty-bay{padding:.5rem .75rem;flex:1;display:flex;align-items:center;justify-content:center;color:#1e3a5f;font-weight:700;font-size:.82rem}
    /* RIGHT */
    .right{flex:0 0 32%;display:flex;flex-direction:column;overflow:hidden;background:#080e1a}
    .wl-hdr{padding:.45rem 1rem;background:rgba(251,191,36,.06);border-bottom:1px solid rgba(251,191,36,.15);font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fbbf24;flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
    .wl-cnt{background:rgba(251,191,36,.15);color:#fbbf24;padding:2px 8px;border-radius:10px;font-size:.75rem}
    .wl-body{flex:1;overflow-y:auto;padding:.5rem}
    .wl-body::-webkit-scrollbar{width:4px} .wl-body::-webkit-scrollbar-thumb{background:#1e2d48;border-radius:4px}
    @keyframes si{from{transform:translateX(-10px);opacity:0}to{transform:translateX(0);opacity:1}}
    .wl-row{display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;border-radius:10px;background:#0d1523;border:1px solid #1e2d48;margin-bottom:.45rem;animation:si .4s ease}
    .wl-num{width:27px;height:27px;border-radius:50%;background:#1e2d48;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:900;color:#94a3b8;flex-shrink:0}
    .wl-info{flex:1;min-width:0}
    .wl-lic{font-size:.95rem;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .wl-do{font-size:.7rem;color:#818cf8} .wl-tgt{font-size:.65rem;color:#6366f1;font-weight:700}
    .wl-time{font-size:.95rem;font-weight:900;color:#fbbf24;flex-shrink:0}
    .wl-type{font-size:.62rem;font-weight:700;padding:2px 5px;border-radius:5px;flex-shrink:0}
    .wi{background:#0c2340;color:#60a5fa} .wo{background:#2c1207;color:#fb923c}
    .empty-wl{padding:2rem 1rem;text-align:center;color:#1e3a5f;font-size:.85rem;font-weight:700}
    #sdot{width:8px;height:8px;border-radius:50%;background:#ef4444;display:inline-block;margin-right:5px}
    #sdot.on{background:#34d399;animation:none} #sdot.off{animation:pd 1s ease-in-out infinite}
    .job-in{background:#0ea5e9;color:#fff;font-weight:900;font-size:.72rem;padding:2px 10px;border-radius:999px;display:inline-block}
    .job-out{background:#f97316;color:#fff;font-weight:900;font-size:.72rem;padding:2px 10px;border-radius:999px;display:inline-block}
    .st-badge{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;display:inline-block}
  </style>
</head>
<body>

<header class="hdr">
  <div style="display:flex;align-items:center">
    <div class="logo">R</div>
    <div>
      <div class="app-name">DOCK <span>QUEUE</span></div>
      <div class="sub">
        <span id="sdot" class="off"></span>
        <span id="slbl">กำลังเชื่อมต่อ Firebase...</span>
        &nbsp;|&nbsp; 📅 <span id="datelbl">—</span>
      </div>
    </div>
  </div>
  <div style="text-align:right">
    <div class="clock" id="clk">00:00:00</div>
    <div class="clock-date" id="clkd">—</div>
  </div>
</header>

<div class="body">
  <div class="left">
    <div class="sec-hdr">⚡ Live Dock Board (สถานะหน้าท่า)</div>
    <div class="dock-grid" id="dg"><div style="color:#374151;font-size:.9rem;padding:2rem;grid-column:1/-1;text-align:center">⏳ กำลังโหลด...</div></div>
  </div>
  <div class="right">
    <div class="wl-hdr">🅿️ Waitlist <span class="wl-cnt" id="wlc">0</span></div>
    <div class="wl-body" id="wlb"><div class="empty-wl">ไม่มีคิวรอ</div></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════
// ✅ FIX #1: ใช้ Firebase rapo-system (ถูกต้อง)
//    + Rules เปิดให้ read โดยไม่ต้อง auth
//    + Realtime listener .on('value') — ไม่ต้อง poll
// ════════════════════════════════════════════════════════
var FB_CFG = {
  apiKey:            "AIzaSyCx2A8zmYI1GxvJY2-De6A7FPo1tgVRJk8",
  authDomain:        "rapo-system.firebaseapp.com",
  databaseURL:       "https://rapo-system-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "rapo-system",
  storageBucket:     "rapo-system.firebasestorage.app",
  messagingSenderId: "87090183469",
  appId:             "1:87090183469:web:eafb1ded183755f329a7a4"
};
if (!firebase.apps.length) firebase.initializeApp(FB_CFG);
var db = firebase.database();

var bays = [], bookings = {};
var targetDate = new Date().toISOString().split('T')[0];

// รับวันที่จาก URL
var qs = window.location.search.substring(1).split('&');
for (var i=0;i<qs.length;i++){var p=qs[i].split('=');if(p[0]==='date'&&p[1])targetDate=decodeURIComponent(p[1]);}
document.getElementById('datelbl').textContent = targetDate;

// ── Clock ─────────────────────────────────────────────
var DAYS=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
function tick(){
  var n=new Date();
  document.getElementById('clk').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');
  document.getElementById('clkd').textContent='วัน'+DAYS[n.getDay()]+'ที่ '+n.getDate()+'/'+(n.getMonth()+1)+'/'+n.getFullYear();
  // Auto-update date if not forced via URL
  if (!window.location.search.includes('date')) {
    var tod=new Date().toISOString().split('T')[0];
    if (tod!==targetDate){targetDate=tod;document.getElementById('datelbl').textContent=tod;render();}
  }
}
setInterval(tick,1000); tick();

// ── Status map ────────────────────────────────────────
var SL={Pending:'รอเข้าท่า',Arrived:'รถมาถึง',Loading:'กำลังโหลด',WaitingDoc:'รอเอกสาร'};
var SC={Arrived:'sp s-arr',Loading:'sp s-ld',WaitingDoc:'sp s-wd',Pending:'sp s-pnd'};

// ── Firebase Realtime Listeners ───────────────────────
db.ref('smartdock/bays').on('value',function(s){
  var d=s.val();
  if(!d){bays=[];render();return;}
  bays=Array.isArray(d)?d.filter(Boolean):Object.values(d).filter(Boolean);
  render();
},function(e){
  document.getElementById('sdot').className='off';
  document.getElementById('slbl').textContent='❌ '+e.message;
});

db.ref('smartdock/bookings').on('value',function(s){
  bookings=s.val()||{};
  document.getElementById('sdot').className='on';
  document.getElementById('slbl').textContent='🟢 ออนไลน์ — Realtime';
  render();
},function(e){
  document.getElementById('sdot').className='off';
  document.getElementById('slbl').textContent='❌ '+e.message;
});

// ── Helpers ───────────────────────────────────────────
function all(){return Object.values(bookings).filter(Boolean);}
function todayActive(){return all().filter(function(b){return b.date===targetDate&&b.status!=='Completed';});}
function dockBook(name){return todayActive().filter(function(b){return b.allocation===name;});}
function waitlist(){return todayActive().filter(function(b){return b.allocation==='Waitlist';});}
function isDelay(b){
  if(!b||b.status==='Completed'||b.status==='Pending')return false;
  var tod=new Date().toISOString().split('T')[0];
  if(b.date!==tod)return false;
  var n=new Date();
  var now=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  return now>b.end_time||now>b.endTime;
}
function gTime(b){return b.end_time||b.endTime||'';}
function gStart(b){return b.start_time||b.startTime||'';}
function gLic(b){return b.license_plate||b.license||'';}
function gShip(b){return b.shipment_no||b.shipmentNo||'';}
function gDO(b){return b.do_number||b.doNumber||'';}
function toMin(t){var p=(t||'').split(':').map(Number);return p.length===2&&!isNaN(p[0])?p[0]*60+p[1]:null;}
function getOTD(b){
  if(!b || b.status==='Completed') return null;
  var planIn  = toMin(b.startTime);
  var planOut = toMin(b.endTime);
  var arrived = toMin(b.timeArrived);
  var now     = new Date();
  var nowMin  = now.getHours()*60 + now.getMinutes();

  if(!planIn && !planOut) return null;

  if(arrived){
    if(!planIn) return {label:'ON TIME', color:'#4ade80', bg:'rgba(22,163,74,.2)', diff:0};
    var d = arrived - planIn;
    if(d <= 0)  return {label:'EARLY',   color:'#38bdf8', bg:'rgba(56,189,248,.2)', diff:Math.abs(d)};
    if(d <= 15) return {label:'ON TIME', color:'#4ade80', bg:'rgba(74,222,128,.2)', diff:d};
    return             {label:'DELAY',   color:'#f87171', bg:'rgba(239,68,68,.25)', diff:d};
  }

  if(!planIn) return null;
  var gap = nowMin - planIn;
  if(gap < -15) return {label:'INCOMING', color:'#818cf8', bg:'rgba(99,102,241,.2)', diff:Math.abs(gap)};
  if(gap <=  0) return {label:'DUE NOW',  color:'#fbbf24', bg:'rgba(251,191,36,.2)', diff:Math.abs(gap)};
  if(gap <= 15) return {label:'LATE',     color:'#fb923c', bg:'rgba(251,146,60,.2)', diff:gap};
  return               {label:'DELAY',    color:'#f87171', bg:'rgba(239,68,68,.25)', diff:gap};
}
function gVendor(b){return b.vendor||'';}
function gVeh(b){return b.vehicle||'';}
function gJob(b){return b.job_type||b.jobType||'IN';}
function gArr(b){return b.time_arrived||b.timeArrived||'—';}
function gStatus(b){
  var s=b.status||'Pending';
  var map={
    'Pending':   {label:'รอเข้าท่า', color:'#94a3b8',bg:'rgba(148,163,184,.2)'},
    'Arrived':   {label:'มาถึงแล้ว',color:'#38bdf8',bg:'rgba(56,189,248,.2)'},
    'Loading':   {label:'Loading',   color:'#a78bfa',bg:'rgba(167,139,250,.2)'},
    'WaitingDoc':{label:'รอเอกสาร', color:'#fb923c',bg:'rgba(251,146,60,.2)'},
    'Departing': {label:'รถออกแล้ว',color:'#f43f5e',bg:'rgba(244,63,94,.2)'},
    'Completed': {label:'เสร็จสิ้น',color:'#4ade80',bg:'rgba(74,222,128,.2)'},
  };
  return map[s]||{label:s,color:'#94a3b8',bg:'rgba(148,163,184,.2)'};
}

// ── Render ────────────────────────────────────────────
function render(){renderDocks();renderWaitlist();}

function renderDocks(){
  var g=document.getElementById('dg');
  if(!bays.length){g.innerHTML='<div style="color:#374151;padding:2rem;grid-column:1/-1;text-align:center">ยังไม่มีช่องจอด</div>';return;}
  var h='';
  for(var i=0;i<bays.length;i++){
    var bay=bays[i];
    var bl=dockBook(bay.name);
    var b=bl.length?bl[0]:null;
    var delay=b&&isDelay(b);
    var isBusy=bay.status==='Busy'||bay.status==='Maintenance';
    var cls='dc'+(b?(' occ'+(delay?' delay':'')):(isBusy?' busy':''));
    h+='<div class="'+cls+'">';
    if(b){
      if(delay)h+='<div style="background:#7f1d1d;color:#fca5a5;font-size:.62rem;font-weight:700;padding:3px;text-align:center" class="da">⚠️ DELAY — เกินเวลา Plan</div>';
      var sc=SC[b.status]||'sp s-pnd';
      var sl=SL[b.status]||b.status;
      var io=gJob(b)==='OUT'?'<span class="tag to">OUT</span>':'<span class="tag ti">IN</span>';
      h+='<div class="dc-head"><span class="dn">'+bay.name+'</span><span class="'+sc+'">'+sl+'</span></div>';
      h+='<div class="dc-body">';
      var _job=gJob(b)==='OUT'?'<span class="job-out">📤 OUT</span>':'<span class="job-in">📥 IN</span>';
      var _st=gStatus(b);
      var _stb='<span class="st-badge" style="background:'+_st.bg+';color:'+_st.color+'">'+_st.label+'</span>';
      var _otd=getOTD(b);
      var _otdb=_otd?'<span class="st-badge" style="background:'+_otd.bg+';color:'+_otd.color+';font-weight:900">'+_otd.label+(_otd.diff>0?' '+_otd.diff+'m':'')+'</span>':'';
      h+='<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px">'+_job+_stb+_otdb+'</div>';
      h+='<div class="t-do-label">DO Number</div>';
      h+='<div class="t-do-num">'+(gDO(b)||gShip(b))+'</div>';
      if(gShip(b)) h+='<div class="t-do">Shipment: '+gShip(b)+'</div>';
      h+='<div class="t-lic">🚛 '+gLic(b)+'</div>';
      h+='<div class="t-ven">'+gVendor(b)+'</div>';
      h+='</div>';
      h+='<div class="dc-foot"><span>Plan ออก: <b>'+gTime(b)+'</b></span><span>มาถึง: <b>'+gArr(b)+'</b></span></div>';
    } else {
      h+='<div class="dc-head"><span class="dn">'+bay.name+'</span>';
      h+=isBusy?'<span style="font-size:.62rem;color:#ef4444;font-weight:700">CLOSED</span>':'<span style="font-size:.62rem;color:#1e3a5f;font-weight:700">EMPTY</span>';
      h+='</div>';
      h+='<div class="empty-bay">'+(isBusy?(bay.status==='Maintenance'?'🔧 ซ่อมบำรุง':'⚠️ ปิดชั่วคราว'):'✅ ว่าง')+'</div>';
    }
    h+='</div>';
  }
  g.innerHTML=h;
}

function renderWaitlist(){
  var list=waitlist();
  document.getElementById('wlc').textContent=list.length;
  var el=document.getElementById('wlb');
  if(!list.length){el.innerHTML='<div class="empty-wl">ไม่มีคิวรอในระบบ</div>';return;}
  var h='';
  for(var i=0;i<list.length;i++){
    var b=list[i];
    var ic=gJob(b)==='OUT'?'wl-type wo':'wl-type wi';
    var it=gJob(b)==='OUT'?'OUT':'IN';
    var tgt=b.target_dock||b.targetDock||'';
    h+='<div class="wl-row">';
    h+='<div class="wl-num">'+(i+1)+'</div>';
    h+='<div class="wl-info">';
    h+='<div class="wl-lic">'+gLic(b)+'</div>';
    h+='<div class="wl-do">'+(gDO(b)||gShip(b))+'</div>';
    if(tgt)h+='<div class="wl-tgt">รอ '+tgt+'</div>';
    h+='</div>';
    h+='<span class="'+ic+'">'+it+'</span>';
    h+='<div class="wl-time">'+gStart(b)+'</div>';
    h+='</div>';
  }
  el.innerHTML=h;
}

// ── Auto-scroll ───────────────────────────────────────
var sd=1;
setInterval(function(){
  var el=document.getElementById('wlb');
  if(el.scrollHeight<=el.clientHeight)return;
  el.scrollTop+=sd;
  if(el.scrollTop+el.clientHeight>=el.scrollHeight-2){sd=-1;setTimeout(function(){sd=1;},2500);}
  if(el.scrollTop<=0)sd=1;
},40);

// ── Auto-reload ทุก 2 ชม ─────────────────────────────
setTimeout(function(){window.location.reload();},2*60*60*1000);
</script>
</body>
</html>

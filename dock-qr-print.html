<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>พิมพ์ QR Code Dock — RAPO</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    /* ── Screen Styles ───────────────────────────────────── */
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --blue:   #021D49;
      --indigo: #6366f1;
      --green:  #16a34a;
      --gray:   #6b7280;
      --border: #e2e8f0;
    }
    body {
      font-family:'Sarabun',sans-serif;
      background:#f1f5f9;
      color:#1e293b;
      min-height:100vh;
    }

    /* Top Bar */
    .topbar {
      background:var(--blue);
      color:white;
      padding:0.85rem 1.5rem;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:1rem;
      flex-wrap:wrap;
      position:sticky;
      top:0;
      z-index:100;
      box-shadow:0 2px 12px rgba(0,0,0,0.2);
    }
    .topbar-left { display:flex; align-items:center; gap:0.75rem; }
    .topbar-logo { width:36px; height:36px; background:white; border-radius:9px; display:flex; align-items:center; justify-content:center; font-weight:900; color:var(--blue); font-size:1rem; flex-shrink:0; }
    .topbar-title { font-size:1rem; font-weight:700; }
    .topbar-sub   { font-size:0.72rem; opacity:0.7; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:0.4rem; padding:0.6rem 1.1rem; border:none; border-radius:9px; font-size:0.88rem; font-weight:700; font-family:'Sarabun',sans-serif; cursor:pointer; transition:all 0.2s; text-decoration:none; }
    .btn-primary { background:var(--indigo); color:white; }
    .btn-primary:hover { background:#4f46e5; }
    .btn-outline { background:rgba(255,255,255,0.12); color:white; border:1.5px solid rgba(255,255,255,0.3); }
    .btn-outline:hover { background:rgba(255,255,255,0.22); }
    .btn-green { background:var(--green); color:white; }
    .btn-green:hover { background:#15803d; }

    /* Controls */
    .controls {
      padding:1.25rem 1.5rem;
      background:white;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      gap:1rem;
      flex-wrap:wrap;
    }
    .controls label { font-size:0.85rem; font-weight:600; color:var(--gray); }

    /* Loading */
    .loading-wrap {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:50vh; gap:1rem; color:var(--gray);
    }
    .spinner { width:32px; height:32px; border:3px solid #e2e8f0; border-top-color:var(--indigo); border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Grid Preview */
    .grid-preview {
      padding:1.5rem;
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap:1rem;
    }
    .preview-card {
      background:white;
      border:2px solid var(--border);
      border-radius:12px;
      overflow:hidden;
      cursor:pointer;
      transition:all 0.2s;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:1rem;
      gap:0.65rem;
    }
    .preview-card:hover { border-color:var(--indigo); box-shadow:0 4px 16px rgba(99,102,241,0.12); transform:translateY(-2px); }
    .preview-card.selected { border-color:var(--indigo); background:#eef2ff; }
    .preview-card img { width:100px; height:100px; image-rendering:pixelated; }
    .preview-dock-name { font-weight:900; font-size:1rem; color:var(--blue); }
    .preview-dock-code { font-size:0.72rem; color:var(--gray); font-family:monospace; }
    .preview-btn { font-size:0.78rem; padding:0.3rem 0.75rem; }

    /* Toast */
    #toast {
      position:fixed; bottom:1.5rem; left:50%;
      transform:translateX(-50%) translateY(100px);
      background:#1e293b; color:white; padding:0.7rem 1.4rem;
      border-radius:12px; font-size:0.88rem; font-weight:600;
      z-index:9999; transition:transform 0.3s;
      box-shadow:0 8px 24px rgba(0,0,0,0.2); white-space:nowrap;
    }
    #toast.show { transform:translateX(-50%) translateY(0); }

    /* ── PRINT STYLES ─────────────────────────────────────── */
    @media print {
      /* ซ่อนทุกอย่างยกเว้น print-sheet */
      body > *:not(#print-sheet) { display:none !important; }
      #print-sheet { display:block !important; }

      @page {
        size: A5 portrait;
        margin: 0;
      }

      #print-sheet {
        width:148mm;
        height:210mm;
        page-break-after:always;
        display:flex !important;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        padding:8mm;
        background:white;
        font-family:'Sarabun',sans-serif;
      }

      .print-header {
        width:100%;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding-bottom:5mm;
        border-bottom:1.5px solid #e2e8f0;
        margin-bottom:6mm;
      }
      .print-logo-box {
        width:10mm; height:10mm;
        background:#021D49;
        border-radius:2mm;
        display:flex; align-items:center; justify-content:center;
        color:white; font-weight:900; font-size:5mm;
      }
      .print-company { font-size:4mm; font-weight:700; color:#021D49; }
      .print-sub     { font-size:2.5mm; color:#64748b; margin-top:0.5mm; }

      .print-dock-name {
        font-size:22mm;
        font-weight:900;
        color:#021D49;
        text-align:center;
        letter-spacing:0.02em;
        margin:4mm 0 3mm;
        line-height:1;
      }
      .print-qr-wrap {
        background:#f8fafc;
        border:1.5px solid #e2e8f0;
        border-radius:4mm;
        padding:6mm;
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:3mm;
        width:100%;
        max-width:90mm;
      }
      .print-qr-img { width:55mm; height:55mm; image-rendering:pixelated; }
      .print-qr-code {
        font-family:monospace;
        font-size:5mm;
        font-weight:700;
        color:#374151;
        letter-spacing:0.08em;
        background:#e2e8f0;
        padding:1.5mm 4mm;
        border-radius:2mm;
      }
      .print-inst {
        font-size:3mm;
        color:#64748b;
        text-align:center;
        margin-top:4mm;
        line-height:1.5;
      }
      .print-footer {
        margin-top:auto;
        padding-top:4mm;
        border-top:1px solid #e2e8f0;
        width:100%;
        display:flex;
        justify-content:space-between;
        align-items:center;
        font-size:2.5mm;
        color:#94a3b8;
      }
      .print-status-row {
        display:flex;
        gap:3mm;
        justify-content:center;
        margin-top:3mm;
        flex-wrap:wrap;
      }
      .print-status-chip {
        font-size:2.5mm;
        padding:1mm 3mm;
        border-radius:2mm;
        font-weight:700;
      }
    }

    /* Hidden print sheet (screen) */
    #print-sheet { display:none; }
  </style>
</head>
<body>

<!-- Top Bar -->
<nav class="topbar">
  <div class="topbar-left">
    <a href="dock.html" class="btn btn-outline" style="padding:0.4rem 0.75rem;">←</a>
    <div class="topbar-logo">R</div>
    <div>
      <div class="topbar-title">🖨️ พิมพ์ QR Code ป้ายช่องจอด</div>
      <div class="topbar-sub">ขนาด A5 — สแกนแล้วอัปเดตสถานะอัตโนมัติ</div>
    </div>
  </div>
  <div style="display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap;">
    <button class="btn btn-primary" id="btn-print-all">🖨️ พิมพ์ทุกช่อง</button>
    <button class="btn btn-green" id="btn-print-selected" style="display:none;">🖨️ พิมพ์ที่เลือก (<span id="selected-count">0</span>)</button>
  </div>
</nav>

<!-- Controls -->
<div class="controls">
  <label>เลือกช่องจอด:</label>
  <button class="btn btn-outline" id="btn-select-all" style="background:#f1f5f9; color:var(--blue); border-color:var(--border);">☑️ เลือกทั้งหมด</button>
  <button class="btn btn-outline" id="btn-deselect-all" style="background:#f1f5f9; color:var(--gray); border-color:var(--border);">☐ ยกเลิกทั้งหมด</button>
  <div style="margin-left:auto; font-size:0.82rem; color:var(--gray);">
    💡 คลิกการ์ดเพื่อเลือก/ยกเลิก | กด พิมพ์ที่เลือก เพื่อพิมพ์เฉพาะช่องที่ต้องการ
  </div>
</div>

<!-- Loading -->
<div id="loading-wrap" class="loading-wrap">
  <div class="spinner"></div>
  <span>กำลังโหลดข้อมูลช่องจอด...</span>
</div>

<!-- Grid Preview -->
<div class="grid-preview" id="grid-preview" style="display:none;"></div>

<!-- Hidden Print Sheet (ถูก inject ก่อนพิมพ์) -->
<div id="print-sheet"></div>

<div id="toast">—</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
  var firebaseConfig = {
    apiKey:            "AIzaSyCx2A8zmYI1GxvJY2-De6A7FPo1tgVRJk8",
    authDomain:        "rapo-system.firebaseapp.com",
    databaseURL:       "https://rapo-system-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:         "rapo-system",
    storageBucket:     "rapo-system.firebasestorage.app",
    messagingSenderId: "87090183469",
    appId:             "1:87090183469:web:eafb1ded183755f329a7a4"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var rtdb = firebase.database();

  var bays = [];
  var selected = new Set();
  var printQueue = [];
  var printIndex = 0;

  // ── Load Bays ─────────────────────────────────────────────
  rtdb.ref("smartdock/bays").once("value", function(snap) {
    var data = snap.val();
    if (!data) {
      document.getElementById("loading-wrap").innerHTML =
        '<div style="text-align:center; color:#ef4444; font-size:0.9rem; padding:2rem;">⚠️ ไม่พบข้อมูลช่องจอด<br><small>กรุณาตั้งค่าช่องจอดใน dock.html ก่อน</small></div>';
      return;
    }
    bays = Array.isArray(data)
      ? data.filter(Boolean)
      : Object.values(data).filter(Boolean);

    // เลือกทุกช่องเป็น default
    bays.forEach(function(b) { selected.add(b.name); });
    updateSelectedCount();
    renderGrid();
    document.getElementById("loading-wrap").style.display   = "none";
    document.getElementById("grid-preview").style.display   = "grid";
  });

  // ── Render Grid ────────────────────────────────────────────
  function renderGrid() {
    var html = "";
    bays.forEach(function(bay) {
      var code  = bay.name.toUpperCase().replace(/\s+/g,"-");
      var qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(code);
      var isSel = selected.has(bay.name);
      html += '<div class="preview-card' + (isSel ? " selected" : "") + '" onclick="toggleSelect(\'' + bay.name + '\')" id="card-' + bay.name.replace(/\s/g,"_") + '">';
      html += '<img src="' + qrUrl + '" alt="QR ' + bay.name + '" loading="lazy">';
      html += '<div class="preview-dock-name">' + bay.name + '</div>';
      html += '<div class="preview-dock-code">' + code + '</div>';
      html += '<button class="btn btn-primary preview-btn" onclick="event.stopPropagation(); printSingle(\'' + bay.name + '\')">🖨️ พิมพ์ช่องนี้</button>';
      html += '</div>';
    });
    document.getElementById("grid-preview").innerHTML = html;
  }

  // ── Toggle Select ──────────────────────────────────────────
  window.toggleSelect = function(name) {
    if (selected.has(name)) selected.delete(name);
    else selected.add(name);
    updateSelectedCount();
    var card = document.getElementById("card-" + name.replace(/\s/g,"_"));
    if (card) {
      if (selected.has(name)) card.classList.add("selected");
      else card.classList.remove("selected");
    }
  };

  function updateSelectedCount() {
    var n = selected.size;
    document.getElementById("selected-count").textContent = n;
    document.getElementById("btn-print-selected").style.display = n > 0 ? "inline-flex" : "none";
  }

  document.getElementById("btn-select-all").addEventListener("click", function() {
    bays.forEach(function(b) { selected.add(b.name); });
    updateSelectedCount();
    document.querySelectorAll(".preview-card").forEach(function(c) { c.classList.add("selected"); });
  });
  document.getElementById("btn-deselect-all").addEventListener("click", function() {
    selected.clear();
    updateSelectedCount();
    document.querySelectorAll(".preview-card").forEach(function(c) { c.classList.remove("selected"); });
  });

  // ── Print Single ───────────────────────────────────────────
  window.printSingle = function(name) {
    printQueue = [name];
    printIndex = 0;
    printNext();
  };

  document.getElementById("btn-print-selected").addEventListener("click", function() {
    if (selected.size === 0) { toast("⚠️ เลือกช่องจอดก่อน"); return; }
    printQueue = Array.from(selected);
    printIndex = 0;
    printNext();
  });

  document.getElementById("btn-print-all").addEventListener("click", function() {
    printQueue = bays.map(function(b) { return b.name; });
    printIndex = 0;
    printNext();
  });

  // ── Print Engine ───────────────────────────────────────────
  // พิมพ์ทีละแผ่น (A5) โดย inject HTML เข้า #print-sheet แล้ว window.print()
  // เมื่อ after print → ถ้ายังมีใน queue → พิมพ์ต่อ
  function printNext() {
    if (printIndex >= printQueue.length) {
      toast("✅ พิมพ์ครบ " + printQueue.length + " แผ่นแล้ว", 3000);
      return;
    }
    var name = printQueue[printIndex];
    var bay  = bays.find(function(b){ return b.name === name; });
    if (!bay) { printIndex++; printNext(); return; }

    var code  = bay.name.toUpperCase().replace(/\s+/g,"-");
    var qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=" + encodeURIComponent(code) + "&color=021D49&bgcolor=ffffff&margin=10";
    var today = new Date().toLocaleDateString("th-TH", { year:"numeric", month:"long", day:"numeric" });

    // สร้าง print content
    document.getElementById("print-sheet").innerHTML =
      '<div class="print-header">' +
        '<div style="display:flex;align-items:center;gap:3mm;">' +
          '<div class="print-logo-box">R</div>' +
          '<div><div class="print-company">RAPO — Smart Dock</div><div class="print-sub">ป้ายประจำช่องจอด / Dock Badge</div></div>' +
        '</div>' +
        '<div style="text-align:right;font-size:2.5mm;color:#94a3b8;">' + today + '</div>' +
      '</div>' +

      '<div class="print-dock-name">' + bay.name + '</div>' +

      '<div class="print-qr-wrap">' +
        '<img class="print-qr-img" src="' + qrUrl + '" alt="QR ' + bay.name + '">' +
        '<div class="print-qr-code">' + code + '</div>' +
      '</div>' +

      '<div class="print-inst">' +
        '📱 สแกน QR Code ด้านบนเพื่ออัปเดตสถานะ<br>' +
        'Scan this QR Code to update dock status' +
      '</div>' +

      '<div class="print-status-row">' +
        '<div class="print-status-chip" style="background:#dbeafe;color:#1d4ed8;">1. รถมาถึง</div>' +
        '<div class="print-status-chip" style="background:#ede9fe;color:#6d28d9;">2. โหลดงาน</div>' +
        '<div class="print-status-chip" style="background:#fff7ed;color:#c2410c;">3. รอเอกสาร</div>' +
        '<div class="print-status-chip" style="background:#dcfce7;color:#15803d;">4. เสร็จสิ้น</div>' +
      '</div>' +

      '<div class="print-footer">' +
        '<span>RAPO Stock & Dock System</span>' +
        '<span>santar-c.github.io/smart-Rapo</span>' +
      '</div>';

    // รอให้ QR โหลดก่อนพิมพ์
    var img = document.getElementById("print-sheet").querySelector("img");
    function doPrint() {
      window.print();
      printIndex++;
      if (printIndex < printQueue.length) {
        // รอให้ dialog ปิดก่อน (delay 800ms)
        setTimeout(printNext, 800);
      } else {
        toast("✅ พิมพ์ครบทุกช่องแล้ว!", 3000);
      }
    }
    if (img.complete) {
      setTimeout(doPrint, 300);
    } else {
      img.onload  = function() { setTimeout(doPrint, 300); };
      img.onerror = function() { setTimeout(doPrint, 300); };
    }
  }

  // ── Toast ──────────────────────────────────────────────────
  var toastTimer;
  function toast(msg, dur) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, dur || 2500);
  }
</script>
</body>
</html>

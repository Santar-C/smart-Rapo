<script type="text/babel">
// ══════════════════════════════════════════════════════════
// FIREBASE CONFIG — rapo-system (ถูกต้อง)
// ══════════════════════════════════════════════════════════
const FB_CONFIG = {
  apiKey:            "AIzaSyCx2A8zmYI1GxvJY2-De6A7FPo1tgVRJk8",
  authDomain:        "rapo-system.firebaseapp.com",
  databaseURL:       "https://rapo-system-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "rapo-system",
  storageBucket:     "rapo-system.firebasestorage.app",
  messagingSenderId: "87090183469",
  appId:             "1:87090183469:web:eafb1ded183755f329a7a4"
};
if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
const rtdb = firebase.database();

// ══════════════════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════════════════
const TODAY = () => new Date().toISOString().split('T')[0];
const TIME_NOW = () => new Date().toLocaleTimeString('th-TH',{hour12:false,hour:'2-digit',minute:'2-digit'});

const STATUSES = ['Pending','Arrived','Loading','WaitingDoc','Completed'];
const STATUS_LABEL = { Pending:'รอเข้าท่า', Arrived:'1.รถมาดึง', Loading:'2.โหลดงาน', WaitingDoc:'3.รอเอกสาร', Completed:'4.เสร็จสิ้น' };
const STATUS_CLS = {
  Pending:'bg-slate-100 text-slate-600 border-slate-300',
  Arrived:'bg-sky-100 text-sky-700 border-sky-300',
  Loading:'bg-purple-100 text-purple-700 border-purple-300',
  WaitingDoc:'bg-orange-100 text-orange-700 border-orange-300',
  Completed:'bg-emerald-100 text-emerald-700 border-emerald-300',
};
const INIT_BAYS = Array.from({length:9},(_,i)=>({name:`Dock ${String(i+1).padStart(2,'0')}`,status:'Available'}));

// Auto-generate shipment number
const genShipmentNo = (date, type, bookings) => {
  if (!date) return '';
  const d = new Date(date);
  const prefix = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  const code = type === 'OUT' ? 'RCEX' : 'RCIM';
  const existing = bookings.filter(b => b.shipmentNo?.startsWith(`${prefix}-${code}`));
  let max = 0;
  existing.forEach(b => {
    const m = b.shipmentNo?.match(new RegExp(`-${code}(\\d+)$`));
    if (m) max = Math.max(max, parseInt(m[1]));
  });
  return `${prefix}-${code}${String(max+1).padStart(2,'0')}`;
};

const safe = v => {
  if (!v) return [];
  if (Array.isArray(v)) return v.filter(Boolean);
  return Object.values(v).filter(Boolean);
};

const { useState, useEffect, useRef, useCallback } = React;

// ══════════════════════════════════════════════════════════
// APP
// ══════════════════════════════════════════════════════════
function App() {
  const [bays,     setBays]     = useState(INIT_BAYS);
  const [bookings, setBookings] = useState([]);
  const [online,   setOnline]   = useState(false);
  const [viewDate, setViewDate] = useState(TODAY());
  const [tab,      setTab]      = useState('board');
  const [role,     setRole]     = useState('Admin');
  const [editId,   setEditId]   = useState(null);
  const [manifest, setManifest] = useState(null); // for print
  const [scanOn,   setScanOn]   = useState(false);
  const [scanMsg,  setScanMsg]  = useState({text:'',ok:false});
  const lastScan = useRef({text:'',t:0});

  const isPower  = ['Admin','Ship Co'].includes(role);
  const isAdmin  = role === 'Admin';
  const canDock  = ['Admin','Sup'].includes(role);

  const BLANK_FORM = {
    date:TODAY(), startTime:'', endTime:'',
    shipmentNo:'', doNumber:'', vendor:'',
    license:'', vehicle:'6WT', jobType:'OUT',
    allocation:'Waitlist', driverName:'',
    bookingNo:'', containerNo:'', sealNo:'',
    origin:'CEVA WAREHOUSE', destination:'PAT WAREHOUSE',
  };
  const [form, setForm] = useState(BLANK_FORM);

  // ── Firebase realtime sync ────────────────────────────
  useEffect(() => {
    const bRef = rtdb.ref('smartdock/bookings');
    const dRef = rtdb.ref('smartdock/bays');
    bRef.on('value', snap => {
      setBookings(safe(snap.val()));
      setOnline(true);
    }, () => setOnline(false));
    dRef.on('value', snap => {
      const d = safe(snap.val());
      setBays(d.length ? d.map(x => typeof x==='string' ? {name:x,status:'Available'} : x) : INIT_BAYS);
    });
    return () => { bRef.off(); dRef.off(); };
  }, []);

  // ── Auto-generate shipment no ─────────────────────────
  useEffect(() => {
    if (editId) return;
    const auto = genShipmentNo(form.date, form.jobType, bookings);
    setForm(p => p.shipmentNo !== auto ? {...p, shipmentNo:auto} : p);
  }, [form.date, form.jobType, bookings, editId]);

  // ── Sync helpers ──────────────────────────────────────
  const syncBookings = b => { setBookings(b); rtdb.ref('smartdock/bookings').set(b); };
  const syncBays     = d => { setBays(d);     rtdb.ref('smartdock/bays').set(d); };

  // ── Computed ──────────────────────────────────────────
  const todayBooks = bookings.filter(b => b.date===viewDate && b.status!=='Completed');
  const waitlist   = todayBooks.filter(b => b.allocation==='Waitlist');
  const dockBooks  = todayBooks.filter(b => b.allocation!=='Waitlist');

  const isDelay = b => {
    if (!b || b.status==='Completed'||b.status==='Pending') return false;
    if (b.date !== TODAY()) return false;
    return TIME_NOW() > b.endTime;
  };

  // ── Form submit ───────────────────────────────────────
  const handleSubmit = e => {
    e.preventDefault();
    if (!isPower) return;
    if (form.startTime >= form.endTime) { alert('เวลาออกต้องมากกว่าเวลาเข้า'); return; }
    const data = {...form, status:'Pending'};
    let next;
    if (editId) {
      next = bookings.map(b => b.id===editId ? {...b,...data} : b);
    } else {
      next = [...bookings, {...data, id:Date.now()}];
    }
    syncBookings(next);
    setEditId(null);
    setForm({...BLANK_FORM});
  };

  const handleEdit = b => {
    if (!isPower) return;
    setForm({...BLANK_FORM,...b});
    setEditId(b.id);
    window.scrollTo({top:0,behavior:'smooth'});
  };

  const handleDelete = id => {
    if (!isPower) return;
    if (!confirm('ลบรายการนี้?')) return;
    syncBookings(bookings.filter(b=>b.id!==id));
  };

  const cycleStatus = b => {
    if (!isPower) { alert('ต้องสแกนบาร์โค้ดที่หน้างาน'); return; }
    const i = STATUSES.indexOf(b.status);
    const next = STATUSES[(i+1)%STATUSES.length];
    const now  = TIME_NOW();
    const upd  = {...b, status:next};
    if (next==='Arrived'    && !upd.timeArrived)    upd.timeArrived    = now;
    if (next==='Loading'    && !upd.timeLoading)    upd.timeLoading    = now;
    if (next==='WaitingDoc' && !upd.timeWaitingDoc) upd.timeWaitingDoc = now;
    if (next==='Completed'  && !upd.timeCompleted)  upd.timeCompleted  = now;
    syncBookings(bookings.map(x=>x.id===b.id?upd:x));
  };

  const toggleBay = (name, cur) => {
    if (!canDock) return;
    let next = 'Available';
    if (cur==='Available') next='Busy';
    else if (cur==='Busy') next = isAdmin ? 'Maintenance' : 'Available';
    syncBays(bays.map(d=>d.name===name?{...d,status:next}:d));
  };

  // ── QR A5 Print ───────────────────────────────────────
  const printQR = bay => {

    const today = new Date().toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric'});
    const printWin = window.open('','_blank','width=600,height=850');
    printWin.document.write(`<!DOCTYPE html><html><head>
      <meta charset="UTF-8">

        </div>
        <div style="text-align:right;font-size:2.5mm;color:#94a3b8;">${today}</div>
      </div>
      <div class="dock-name">${bay.name}</div>

        <img class="qr-img" src="${qrUrl}" alt="QR ${bay.name}" onload="window.print();window.close();">
        <div class="qr-code">${code}</div>
      </div>
      <div class="inst">📱 สแกน QR Code เพื่ออัปเดตสถานะ<br>Scan this QR Code to update dock status</div>
      <div class="chips">
        <div class="chip" style="background:#dbeafe;color:#1d4ed8;">1. รถมาดึง</div>
        <div class="chip" style="background:#ede9fe;color:#6d28d9;">2. โหลดงาน</div>
        <div class="chip" style="background:#fff7ed;color:#c2410c;">3. รอเอกสาร</div>
        <div class="chip" style="background:#dcfce7;color:#15803d;">4. เสร็จสิ้น</div>
      </div>
      <div class="footer"><span>RAPO Stock & Dock System</span><span>santar-c.github.io/smart-Rapo</span></div>
    </body></html>`);
    printWin.document.close();
  };

  // ── Truck Manifest Print ──────────────────────────────

      <div style="width:297mm;min-height:210mm;background:white;padding:10mm;font-family:'Sarabun',sans-serif;display:flex;flex-direction:column;-webkit-print-color-adjust:exact;print-color-adjust:exact;">

            INVOICE TO:<br>CEVA LOGISTICS (THAILAND) LTD<br>
            JASMINE CITY BUILDING, 21ST FLOOR ZONE B,<br>
            SOI SUKHUMVIT 23, WATTANA, 10110 THAILAND<br>

          </div>

        <!-- SECTION 1: พนักงานขับรถ -->

        <div style="display:grid;grid-template-columns:repeat(5,1fr);text-align:center;font-size:12px;font-weight:700;background:#c5e0b4;padding:6px 0;border:1px solid black;border-bottom:none;">

        </div>

          <div style="border-right:1px solid black;">${fmtDate(b.date)}</div>

  // ── QR Scanner ────────────────────────────────────────

  useEffect(() => {
    let qr = null;
    if (scanOn) {
      qr = new Html5Qrcode('scan-reader');
      qr.start(
        {facingMode:'environment'},
        {fps:12, qrbox:{width:220,height:160}},
        async text => {
          const now = Date.now();
          if (text===lastScan.current.text && now-lastScan.current.t < 3500) return;
          lastScan.current = {text,t:now};
          const todayStr = TODAY();
          const bay = bays.find(b => b.name.replace(/\s/g,'').toUpperCase() === text.replace(/\s/g,'-').toUpperCase() || b.name.toUpperCase()===text.toUpperCase());
          let booking;
          if (bay) {
            booking = bookings.find(b=>b.allocation===bay.name&&b.status!=='Completed'&&b.date===todayStr);
            if (!booking) { setScanMsg({text:`ไม่มีคิวใน ${bay.name} วันนี้`,ok:false}); setTimeout(()=>setScanMsg({text:'',ok:false}),3000); return; }
          } else {
            booking = bookings.find(b=>(b.shipmentNo?.toUpperCase()===text.toUpperCase()||b.license===text)&&b.date===todayStr&&b.status!=='Completed');
            if (!booking) { setScanMsg({text:'ไม่พบบาร์โค้ดนี้ในระบบ',ok:false}); setTimeout(()=>setScanMsg({text:'',ok:false}),3000); return; }
          }
          const i   = STATUSES.indexOf(booking.status);
          if (i >= STATUSES.length-1) { setScanMsg({text:`${booking.shipmentNo} เสร็จสิ้นแล้ว`,ok:false}); setTimeout(()=>setScanMsg({text:'',ok:false}),3000); return; }
          const next = STATUSES[i+1];
          const t    = TIME_NOW();
          const upd  = {...booking, status:next};
          if (next==='Arrived')    upd.timeArrived    = t;
          if (next==='Loading')    upd.timeLoading    = t;
          if (next==='WaitingDoc') upd.timeWaitingDoc = t;
          if (next==='Completed')  upd.timeCompleted  = t;
          syncBookings(bookings.map(x=>x.id===booking.id?upd:x));
          setScanMsg({text:`✅ ${booking.shipmentNo} → ${STATUS_LABEL[next]}`,ok:true});
          setTimeout(()=>setScanMsg({text:'',ok:false}),3000);
        },
        ()=>{}
      ).catch(()=>setScanOn(false));
    }
    return () => { qr?.stop().catch(()=>{}); };
  }, [scanOn, bays, bookings]);

    const csv=rows.map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');

  // ── QR PRINT VIEW ─────────────────────────────────────
  const QRView = () => (
    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden fade-in">
      <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-white">
        <h3 className="font-bold text-lg text-slate-800">🖨️ พิมพ์ QR Code ป้ายช่องจอด (A5)</h3>
        <button onClick={()=>{bays.forEach((b,i)=>setTimeout(()=>printQR(b),i*900));}} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl font-bold text-sm transition-colors">
          🖨️ พิมพ์ทุกช่อง
        </button>
      </div>
      <div className="flex-1 p-6 overflow-auto bg-slate-50/50">
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
          {bays.map(bay => {
            const code  = bay.name.toUpperCase().replace(/\s+/g,'-');
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(code)}&color=021D49&margin=8`;
            return (
              <div key={bay.name} className="bg-white border border-slate-200 rounded-2xl p-4 flex flex-col items-center gap-3 shadow-sm hover:border-indigo-300 hover:shadow-md transition-all">
                <div className="font-black text-xl text-indigo-900">{bay.name}</div>
                <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                  <img src={qrUrl} alt={bay.name} className="w-24 h-24 object-contain"/>
                </div>
                <div className="text-[10px] text-slate-500 font-mono bg-slate-100 px-2 py-1 rounded">{code}</div>
                <button onClick={()=>printQR(bay)} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl font-bold text-xs transition-colors">
                  🖨️ Print A5
                </button>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );

  // ── LIST / REPORT VIEW ────────────────────────────────
  const ListView = ({completed}) => {
    const data = bookings.filter(b => completed ? b.status==='Completed'&&b.date===viewDate : b.status!=='Completed');
    return (
      <div className="bg-white rounded-2xl shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden fade-in">
        <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-white">
          <h3 className="font-bold text-lg text-slate-800">{completed?'📊 รายงาน Completed':'📋 คิวทั้งหมด'}</h3>
          {completed && <button onClick={exportCSV} className="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-sm transition-colors flex items-center gap-2">⬇️ Export CSV</button>}
        </div>
        <div className="flex-1 overflow-auto dock-scroll p-4">
          <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
            <table className="w-full text-left text-xs md:text-sm min-w-[900px]">
              <thead className="bg-slate-50 text-slate-500 border-b border-slate-200 text-[10px] uppercase tracking-wider">
                <tr>
                  <th className="p-4 font-bold">วันที่ / เวลา</th>
                  <th className="p-4 font-bold">Doc No. / ซัพฯ</th>
                  <th className="p-4 font-bold">ทะเบียน / ขนาด</th>
                  <th className="p-4 font-bold">ช่องจอด</th>
                  <th className="p-4 font-bold">สถานะ</th>
                  <th className="p-4 font-bold text-center">จัดการ</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {data.sort((a,b)=>(a.date+a.startTime).localeCompare(b.date+b.startTime)).map(b=>(
                  <tr key={b.id} className="hover:bg-slate-50/70 transition-colors">
                    <td className="p-4">
                      <div className="font-bold text-slate-800">{b.date}</div>
                      <div className="text-indigo-600 font-bold text-[11px]">{b.startTime} - {b.endTime}</div>
                    </td>
                    <td className="p-4">
                      <div className="font-bold text-indigo-700">{b.shipmentNo}</div>
                      <div className="text-slate-500 text-[11px]">{b.vendor}</div>
                    </td>
                    <td className="p-4"><div className="font-bold">{b.license}</div><div className="text-slate-500 text-[11px]">{b.vehicle}</div></td>
                    <td className="p-4 font-bold text-indigo-600">{b.allocation}</td>
                    <td className="p-4"><StatusBadge booking={b}/></td>
                    <td className="p-4">
                      <div className="flex justify-center gap-2">
                        {isPower && <button onClick={()=>handleEdit(b)} className="p-1.5 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-lg transition-colors" title="แก้ไข">✏️</button>}
                        <button onClick={()=>printManifest(b)} className="p-1.5 bg-sky-50 hover:bg-sky-100 text-sky-600 rounded-lg transition-colors" title="Manifest">🖨️</button>
                        {isPower && <button onClick={()=>handleDelete(b.id)} className="p-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg transition-colors" title="ลบ">🗑️</button>}
                      </div>
                    </td>
                  </tr>
                ))}
                {!data.length && <tr><td colSpan="6" className="p-12 text-center text-slate-400">ไม่มีข้อมูล</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    );
  };

  // ── SCAN VIEW ─────────────────────────────────────────
  const ScanView = () => (
    <div className="flex-1 flex flex-col items-center justify-start p-6 fade-in">
      <div className="w-full max-w-md">
        <h3 className="font-black text-2xl text-slate-800 text-center mb-3">📷 สแกนคิวอัตโนมัติ</h3>
        <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-4 text-sm text-amber-800">
          💡 ลำดับสแกน: 1.รถมาดึง → 2.โหลดงาน → 3.รอเอกสาร → 4.เสร็จสิ้น
        </div>
        {scanMsg.text && (
          <div className={`rounded-xl p-4 mb-4 text-center font-bold ${scanMsg.ok?'bg-emerald-50 text-emerald-800 border border-emerald-200':'bg-red-50 text-red-800 border border-red-200'}`}>
            {scanMsg.text}
          </div>
        )}
        <div className="relative w-full rounded-2xl overflow-hidden shadow-sm bg-slate-900 min-h-[260px] flex items-center justify-center mb-4">
          <div id="scan-reader" className="w-full"></div>
          {!scanOn && <div className="absolute text-white/40 text-sm">กล้องยังไม่เปิด</div>}
        </div>
        <button onClick={()=>setScanOn(!scanOn)}
          className={`w-full py-3.5 rounded-xl font-bold text-white transition-all shadow-md ${scanOn?'bg-red-500 hover:bg-red-600':'bg-indigo-600 hover:bg-indigo-700'}`}>
          {scanOn?'🔴 ปิดกล้อง':'📷 เปิดกล้องสแกน'}
        </button>
      </div>
    </div>
  );

  // ── SCHEDULE VIEW ─────────────────────────────────────
  const ScheduleView = () => {
    const hours = Array.from({length:12},(_,i)=>i+7);
    const todayAll = bookings.filter(b=>b.date===viewDate&&b.allocation!=='Waitlist'&&b.status!=='Completed');
    const COLORS = {Pending:'#94a3b8',Arrived:'#38bdf8',Loading:'#a78bfa',WaitingDoc:'#fb923c',Completed:'#4ade80'};
    return (
      <div className="bg-white rounded-2xl shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden fade-in">
        <div className="p-4 border-b border-slate-100 bg-white">
          <h3 className="font-bold text-lg text-slate-800">📅 ตารางเวลาหน้าท่า</h3>
        </div>
        <div className="flex-1 overflow-auto p-4 bg-slate-50/50">
          <div className="min-w-[800px] bg-white border border-slate-200 rounded-xl shadow-sm p-4">
            <div className="flex ml-28 border-b border-slate-200 pb-2 mb-3">
              {hours.map(h=><div key={h} className="flex-1 text-[10px] text-slate-400 font-bold">{String(h).padStart(2,'0')}:00</div>)}
            </div>
            <div className="space-y-3">
              {bays.map(dock=>{
                const bk = todayAll.filter(b=>b.allocation===dock.name);
                return (
                  <div key={dock.name} className="flex items-center h-14 bg-slate-50 rounded-xl border border-slate-100 hover:border-indigo-100 transition-colors">
                    <div className="w-28 shrink-0 text-xs font-bold text-slate-700 px-3 border-r border-slate-200 h-full flex items-center">{dock.name}</div>
                    <div className="flex-1 relative h-full">
                      {hours.map((_,i)=><div key={i} className="absolute" style={{left:`${(i/hours.length)*100}%`,top:0,bottom:0,width:'1px',background:'#e2e8f0'}}/>)}
                      {bk.map(b=>{
                        const [sh,sm]=(b.startTime||'08:00').split(':').map(Number);
                        const [eh,em]=(b.endTime||'09:00').split(':').map(Number);
                        const totalMin=hours.length*60;
                        const startMin=(sh-hours[0])*60+sm;
                        const durMin=(eh*60+em)-(sh*60+sm);
                        const l=Math.max(0,(startMin/totalMin)*100);
                        const w=Math.min(100-l,(durMin/totalMin)*100);
                        return (
                          <div key={b.id} className="absolute top-1.5 bottom-1.5 rounded-lg flex items-center px-2 text-[10px] font-bold text-white overflow-hidden shadow-sm cursor-pointer hover:opacity-85 transition-opacity"
                            style={{left:`${l}%`,width:`${w}%`,background:COLORS[b.status]||'#94a3b8'}}
                            onClick={()=>isPower&&handleEdit(b)}
                            title={`${b.shipmentNo} | ${b.vendor}`}>
                            {b.jobType==='OUT'?'📤':'📥'} {b.shipmentNo}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    );
  };

  // ══ RENDER ════════════════════════════════════════════
  const TABS = [
    {id:'board',label:'🏭 หน้าท่า'},
    {id:'schedule',label:'📅 ตาราง',hidden:!isPower},
    {id:'list',label:'📋 คิวทั้งหมด',hidden:!isPower},
    {id:'scan',label:'📷 สแกน'},
    {id:'reports',label:'📊 รายงาน',hidden:!isPower},
    {id:'qr',label:'🖨️ QR',hidden:!isAdmin},
  ];

  return (
    <div className="flex flex-col h-full w-full bg-slate-50">

      {/* HEADER */}
      <header className="bg-slate-900 text-white flex flex-col md:flex-row items-center justify-between px-6 py-3 shrink-0 shadow-lg z-10 border-b border-slate-800 gap-3">
        <div className="flex items-center gap-3">
          <a href="index.html" className="w-9 h-9 bg-white/10 hover:bg-white/20 rounded-xl flex items-center justify-center text-white font-bold transition-colors">←</a>
          <div className="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center font-black text-xl shadow-lg shadow-indigo-500/30">S</div>
          <div>
            <h1 className="font-bold text-lg leading-tight">Smart Dock Pro</h1>
            <div className="text-[11px] text-slate-400 flex items-center gap-1.5">
              <span className={`w-2 h-2 rounded-full ${online?'bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]':'bg-amber-400 animate-pulse'}`}/>
              Firebase {online?'ออนไลน์':'กำลังเชื่อมต่อ...'}
            </div>
          </div>
        </div>
        <div className="flex flex-col md:flex-row items-center gap-3 w-full md:w-auto">
          {/* Tabs */}
          <div className="flex gap-1 overflow-x-auto scroll-hide bg-slate-800/50 p-1 rounded-full border border-slate-700/50">
            {TABS.filter(t=>!t.hidden).map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)}
                className={`whitespace-nowrap text-xs font-semibold py-2 px-3 rounded-full transition-all ${tab===t.id?'bg-white text-indigo-700 shadow-md':'text-slate-300 hover:bg-slate-700 hover:text-white'}`}>
                {t.label}
              </button>
            ))}
          </div>
          {/* Controls */}
          <div className="flex items-center gap-2">
            <div className="flex items-center border border-slate-700 rounded-lg bg-slate-800 px-3 py-1.5">
              <span className="text-[11px] text-slate-400 mr-2">📅</span>
              <input type="date" value={viewDate} onChange={e=>setViewDate(e.target.value)}
                className="bg-transparent text-white text-xs font-bold focus:outline-none cursor-pointer [&::-webkit-calendar-picker-indicator]:invert"/>
            </div>
            <button onClick={()=>window.open(`dock-tv.html?date=${viewDate}`,'_blank')}
              className="bg-indigo-600 hover:bg-indigo-500 border border-indigo-500 rounded-lg px-3 py-1.5 text-xs font-bold text-white transition-colors">
              🖥️ TV
            </button>
            <div className="flex items-center border border-slate-700 rounded-lg bg-slate-800 px-3 py-1.5">
              <span className="text-[11px] text-slate-400 mr-2">สิทธิ์:</span>
              <select value={role} onChange={e=>setRole(e.target.value)} className="bg-transparent text-white text-xs font-bold focus:outline-none cursor-pointer">
                {['Admin','Ship Co','Sup','พนักงาน'].map(r=><option key={r} value={r} className="text-slate-900 bg-white">{r}</option>)}
              </select>
            </div>
          </div>
        </div>
      </header>

      {/* MAIN */}
      <div className="flex-1 overflow-hidden flex flex-col md:flex-row p-4 gap-4">
        {isPower && tab==='board' && <FormPanel/>}
        <div className={`flex-1 flex flex-col min-w-0 h-full overflow-hidden gap-4`}>
          {tab==='board'     && <BoardView/>}
          {tab==='schedule'  && <ScheduleView/>}
          {tab==='list'      && <ListView completed={false}/>}
          {tab==='reports'   && <ListView completed={true}/>}
          {tab==='scan'      && <ScanView/>}
          {tab==='qr'        && <QRView/>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

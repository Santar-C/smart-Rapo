const genDocNo = (date,type,bookings)=>{
  if(!date) return '';

  const code=type==='OUT'?'RCEX':'RCIM';

};

const SettingsView = ({settings})=>{
  const [localSettings, setLocalSettings] = React.useState(null);
  const [saving, setSaving] = React.useState(false);
  const [saved, setSaved] = React.useState(false);

  React.useEffect(()=>{ setLocalSettings(JSON.parse(JSON.stringify(settings))); },[settings]);

  if(!localSettings) return <div className="p-6 text-slate-400">กำลังโหลด...</div>;

  const saveToFirebase = async ()=>{
    setSaving(true);
    try {
      await rtdb.ref('smartdock/settings').set(localSettings);
      setSaved(true); setTimeout(()=>setSaved(false), 2500);
    } catch(e){ alert('บันทึกไม่ได้: '+e.message); }
    setSaving(false);
  };

  const ListEditor = ({label, listKey, color})=>{
    const [newVal, setNewVal] = React.useState('');
    const items = localSettings[listKey] || [];
    const cls = color==='sky'?'border-sky-100 text-sky-700 bg-sky-500':color==='purple'?'border-purple-100 text-purple-700 bg-purple-500':'border-indigo-100 text-indigo-700 bg-indigo-500';
    const [borderCls,textCls,dotCls] = cls.split(' ');
    const add = ()=>{
      const v = newVal.trim().toUpperCase();
      if(!v || items.includes(v)) return;
      setLocalSettings(p=>({...p,[listKey]:[...p[listKey],v]}));
      setNewVal('');
    };
    const remove = (i)=>setLocalSettings(p=>({...p,[listKey]:p[listKey].filter((_,idx)=>idx!==i)}));
    const moveUp = (i)=>{ if(i===0) return; const a=[...items]; [a[i-1],a[i]]=[a[i],a[i-1]]; setLocalSettings(p=>({...p,[listKey]:a})); };
    return (
      <div className={`bg-white border ${borderCls} rounded-2xl p-4 shadow-sm`}>

const ScheduleView = ({bays,bookings,viewDate,isPower,onEdit})=>{
  const hours=Array.from({length:13},(_,i)=>i+7);
  const data=bookings.filter(b=>b.date===viewDate&&b.allocation!=='Waitlist'&&b.status!=='Completed');
  const COLORS={Pending:'#94a3b8',Arrived:'#38bdf8',Loading:'#a78bfa',WaitingDoc:'#fb923c',Completed:'#4ade80'};
  return (
    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden fi">
      <div className="p-4 border-b border-slate-100"><h3 className="font-bold text-lg">📅 ตารางเวลาหน้าท่า ({viewDate})</h3></div>
      <div className="flex-1 overflow-auto p-4 bg-slate-50/50">
        <div className="min-w-[800px] bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
          <div className="flex ml-28 border-b border-slate-200 pb-2 mb-3">
            {hours.map(h=><div key={h} className="flex-1 text-[10px] text-slate-400 font-bold">{String(h).padStart(2,'0')}:00</div>)}
          </div>
          <div className="space-y-3">
            {bays.map(dock=>{
              const bk=data.filter(b=>b.allocation===dock.name);
              return (
                <div key={dock.name} className="flex items-center h-14 bg-slate-50 rounded-xl border border-slate-100">
                  <div className="w-28 shrink-0 text-xs font-bold text-slate-700 px-3 border-r border-slate-200 h-full flex items-center">{dock.name}</div>
                  <div className="flex-1 relative h-full">
                    {hours.map((_,i)=><div key={i} className="absolute" style={{left:`${(i/hours.length)*100}%`,top:0,bottom:0,width:'1px',background:'#e2e8f0'}}/>)}
                    {bk.map(b=>{
                      const [sh,sm]=(b.startTime||'08:00').split(':').map(Number);
                      const [eh,em]=(b.endTime||'09:00').split(':').map(Number);
                      const tot=hours.length*60;
                      const l=Math.max(0,((sh-hours[0])*60+sm)/tot*100);
                      const w=Math.min(100-l,((eh*60+em)-(sh*60+sm))/tot*100);
                      return (
                        <div key={b.id} className="absolute top-1.5 bottom-1.5 rounded-lg flex items-center px-2 text-[10px] font-bold text-white overflow-hidden shadow-sm cursor-pointer hover:opacity-85 transition-opacity"
                          style={{left:`${l}%`,width:`${w}%`,background:COLORS[b.status]||'#94a3b8'}}
                          onClick={()=>isPower&&onEdit(b)}
                          title={`${b.shipmentNo} | ${b.vendor}`}>
                          {b.jobType==='OUT'?'📤':'📥'} {b.shipmentNo}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
};

// ════════════════════════════════════════════════════════════
// APP — state & logic only, no sub-component definitions here
// ════════════════════════════════════════════════════════════
const getBlank = ()=>({
  date:TODAY(), startTime:'', endTime:'',
  shipmentNo:'', doNumber:'', vendor:'',
  license:'', vehicle:'6WT', jobType:'OUT',
  allocation:'Waitlist', driverName:'',
  bookingNo:'', containerNo:'', sealNo:'',
  origin:'CEVA WAREHOUSE', destination:'PAT WAREHOUSE',
});
const BLANK = getBlank();

function App() {
  const [bays,     setBays]     = React.useState(INIT_BAYS);
  const [bookings, setBookings] = React.useState([]);
  const [settings, setSettings] = React.useState(DEFAULT_SETTINGS);
  const [online,   setOnline]   = React.useState(false);
  const [viewDate, setViewDate] = React.useState(TODAY());
  const [tab,      setTab]      = React.useState('board');
  const [role,     setRole]     = React.useState('Admin');
  const [editId,   setEditId]   = React.useState(null);
  const [form,     setForm]     = React.useState(getBlank());
  const [scanOn,   setScanOn]   = React.useState(false);
  const [scanMsg,  setScanMsg]  = React.useState({text:'',ok:false});
  const lastScan = React.useRef({text:'',t:0});

  const isPower = ['Admin','Ship Co'].includes(role);
  const isAdmin = role==='Admin';
  const canDock = ['Admin','Sup'].includes(role);

  // ── Firebase realtime ─────────────────────────────────
  React.useEffect(()=>{
    const bRef=rtdb.ref('smartdock/bookings');
    const dRef=rtdb.ref('smartdock/bays');
    const sRef=rtdb.ref('smartdock/settings');
    bRef.on('value',s=>{ setBookings(safe(s.val())); setOnline(true); }, ()=>setOnline(false));
    dRef.on('value',s=>{ const d=safe(s.val()); setBays(d.length?d.map(x=>typeof x==='string'?{name:x,status:'Available'}:x):INIT_BAYS); });
    sRef.on('value',s=>{ const v=s.val(); if(v) setSettings({...DEFAULT_SETTINGS,...v}); });
    return ()=>{ bRef.off(); dRef.off(); sRef.off(); };
  },[]);

  // ── Auto generate Doc No ──────────────────────────────
  React.useEffect(()=>{
    if(editId) return;
    const auto=genDocNo(form.date,form.jobType,bookings);
    setForm(p=>p.shipmentNo!==auto?{...p,shipmentNo:auto}:p);
  },[form.date,form.jobType,bookings,editId]);

  // ── Stop scanner when leaving scan tab ────────────────
  React.useEffect(()=>{ if(tab!=='scan') setScanOn(false); },[tab]);

  // ── Scanner ───────────────────────────────────────────
  React.useEffect(()=>{
    let qr=null;
    if(!scanOn) return;
    qr=new Html5Qrcode('scan-reader');
    qr.start({facingMode:'environment'},{fps:12,qrbox:{width:220,height:160}},
      text=>{
        const now=Date.now();
        if(text===lastScan.current.text&&now-lastScan.current.t<3500) return;
        lastScan.current={text,t:now};
        const todayStr=TODAY();
        const bay=bays.find(b=>b.name.replace(/\s/g,'').toUpperCase()===text.replace(/[\s-]/g,'').toUpperCase());
        let booking;
        if(bay){
          booking=bookings.find(b=>b.allocation===bay.name&&b.status!=='Completed'&&b.date===todayStr);
          if(!booking){setScanMsg({text:`ไม่มีคิวใน ${bay.name} วันนี้`,ok:false});setTimeout(()=>setScanMsg({text:'',ok:false}),3000);return;}
        } else {
          booking=bookings.find(b=>(b.shipmentNo?.toUpperCase()===text.toUpperCase()||b.license===text)&&b.date===todayStr&&b.status!=='Completed');
          if(!booking){setScanMsg({text:'ไม่พบบาร์โค้ดนี้',ok:false});setTimeout(()=>setScanMsg({text:'',ok:false}),3000);return;}
        }
        const i=STATUSES.indexOf(booking.status);
        if(i>=STATUSES.length-1){setScanMsg({text:`${booking.shipmentNo} เสร็จสิ้นแล้ว`,ok:false});setTimeout(()=>setScanMsg({text:'',ok:false}),3000);return;}
        const next=STATUSES[i+1];
        const t=TIMENOW();
        const upd={...booking,status:next};
        if(next==='Arrived')    upd.timeArrived=t;
        if(next==='Loading')    upd.timeLoading=t;
        if(next==='WaitingDoc') upd.timeWaitingDoc=t;
        if(next==='Completed')  upd.timeCompleted=t;
        const nb=bookings.map(x=>x.id===booking.id?upd:x);
        rtdb.ref('smartdock/bookings').set(nb);
        setScanMsg({text:`✅ ${booking.shipmentNo} → ${STAT_LBL[next]}`,ok:true});
        setTimeout(()=>setScanMsg({text:'',ok:false}),3000);
      },()=>{}).catch(()=>setScanOn(false));
    return()=>{ qr?.stop().catch(()=>{}); };
  },[scanOn,bays,bookings]);

  // ── Helpers ───────────────────────────────────────────
  const syncBookings = nb=>{ rtdb.ref('smartdock/bookings').set(nb); };
  const syncBays     = nd=>{ rtdb.ref('smartdock/bays').set(nd); };

  const isDelay = b=>{
    if(!b||b.status==='Completed'||b.status==='Pending') return false;
    if(b.date!==TODAY()) return false;
    return TIMENOW()>b.endTime;
  };

  const handleEdit = b=>{ if(!isPower)return; setForm({...BLANK,...b}); setEditId(b.id); window.scrollTo({top:0,behavior:'smooth'}); };
  const handleDelete = id=>{ if(!isPower||!confirm('ลบรายการนี้?'))return; syncBookings(bookings.filter(b=>b.id!==id)); };
  const cancelEdit = ()=>{ setEditId(null); setForm(getBlank()); };
  const handleCycle = b=>{
    if(!isPower){alert('ต้องสแกนบาร์โค้ดที่หน้างาน');return;}
    const i=STATUSES.indexOf(b.status);
    const next=STATUSES[(i+1)%STATUSES.length];
    const t=TIMENOW();
    const upd={...b,status:next};
    if(next==='Arrived'&&!upd.timeArrived)       upd.timeArrived=t;
    if(next==='Loading'&&!upd.timeLoading)       upd.timeLoading=t;
    if(next==='WaitingDoc'&&!upd.timeWaitingDoc) upd.timeWaitingDoc=t;
    if(next==='Completed'&&!upd.timeCompleted)   upd.timeCompleted=t;
    syncBookings(bookings.map(x=>x.id===b.id?upd:x));
    rtdb.ref('smartdock/changelog').push({
      bookingId:b.id,shipmentNo:b.shipmentNo||'',date:b.date,
      changedBy:currentUser?.email||currentUser?.displayName||'scan',
      changedAt:Date.now(),changedTime:t,
      changes:['Status: '+b.status+' → '+next],note:'',type:'STATUS',
    });
  };
  const handleToggleBay=(name,cur)=>{
    if(!canDock)return;
    let next='Available';
    if(cur==='Available')next='Busy';
    else if(cur==='Busy')next=isAdmin?'Maintenance':'Available';
    syncBays(bays.map(d=>d.name===name?{...d,status:next}:d));
  };
  const handleSubmit=()=>{
    if(!isPower)return;
    let changeNote='', changeFields=[];
    if(editId){
      const orig=bookings.find(b=>b.id===editId)||{};
      if(orig.allocation !==form.allocation)   changeFields.push('Dock: '+(orig.allocation||'-')+' → '+form.allocation);
      if(orig.startTime  !==form.startTime)    changeFields.push('เวลาเข้า: '+(orig.startTime||'-')+' → '+form.startTime);
      if(orig.endTime    !==form.endTime)      changeFields.push('เวลาออก: '+(orig.endTime||'-')+' → '+form.endTime);
      if(orig.license    !==form.license)      changeFields.push('ทะเบียน: '+(orig.license||'-')+' → '+form.license);
      if((orig.target_dock||'')!==(form.target_dock||'')) changeFields.push('Dock เป้าหมาย: '+(orig.target_dock||'-')+' → '+(form.target_dock||'-'));
      if(changeFields.length>0){
        changeNote=window.prompt('📝 เหตุผลการแก้ไข\n\n• '+changeFields.join('\n• '),'');
        if(changeNote===null)return;
        if(!changeNote.trim()&&!window.confirm('ไม่มีหมายเหตุ ยืนยันบันทึก?'))return;
      }
    }
    if(!form.startTime||!form.endTime||!form.vendor||!form.license){
      alert('กรุณากรอกข้อมูลให้ครบ (เวลา, บริษัท, ทะเบียน)');return;
    }
    if(form.startTime>=form.endTime){alert('เวลาออกต้องมากกว่าเวลาเข้า');return;}
    const newEntry={
      ...form,
      status: editId ? (bookings.find(b=>b.id===editId)?.status||'Pending') : 'Pending',
      id: editId || Date.now(),
      updatedAt: Date.now(),
      lastEditBy: currentUser?.email||currentUser?.displayName||'Admin',
      lastEditNote: changeNote||'',
      lastEditTime: TIMENOW(),
    };
    let nb;
    if(editId){
      nb=bookings.map(b=>b.id===editId?newEntry:b);
    } else {
      nb=[...bookings, newEntry];
    }
    rtdb.ref('smartdock/bookings').set(nb).then(()=>{
      const t=Date.now();
      rtdb.ref('smartdock/changelog').push({
        bookingId:   newEntry.id,
        shipmentNo:  newEntry.shipmentNo||'',
        date:        newEntry.date,
        changedBy:   newEntry.lastEditBy,
        changedAt:   t,
        changedTime: TIMENOW(),
        changes:     changeFields.length>0?changeFields:[editId?'บันทึกข้อมูล':'สร้างคิวใหม่'],
        note:        changeNote||'',
        type:        editId?(changeFields.length>0?'EDIT':'UPDATE'):'CREATE',
      });
      setEditId(null);
      setForm(getBlank());
    }).catch(err=>alert('บันทึกไม่สำเร็จ: '+err.message));
  };
  const exportCSV=()=>{
    const done=bookings.filter(b=>b.status==='Completed'&&b.date===viewDate);
    if(!done.length){alert('ไม่มีข้อมูล');return;}
    const rows=[['วันที่','ช่องจอด','Doc No','IN/OUT','บริษัท','ทะเบียน','ขนาดรถ','Plan เข้า','Plan ออก','มาถึง','โหลด','รอเอกสาร','เสร็จ']];
    done.forEach(b=>rows.push([b.date,b.allocation,b.shipmentNo,b.jobType,b.vendor,b.license,b.vehicle,b.startTime,b.endTime,b.timeArrived||'',b.timeLoading||'',b.timeWaitingDoc||'',b.timeCompleted||'']));
    const csv=rows.map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
    Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'})),download:`dock_${viewDate}.csv`}).click();
  };

  const todayBooks = bookings.filter(b=>b.date===viewDate&&b.status!=='Completed');
  const waitlist   = todayBooks.filter(b=>b.allocation==='Waitlist');
  const dockBooks  = todayBooks.filter(b=>b.allocation!=='Waitlist');

  const TABS=[
    {id:'board',lbl:'🏭 หน้าท่า'},
    {id:'schedule',lbl:'📅 ตาราง',h:!isPower},
    {id:'list',lbl:'📋 คิวทั้งหมด',h:!isPower},
    {id:'scan',lbl:'📷 สแกน'},
    {id:'reports',lbl:'📊 รายงาน',h:!isPower},
    {id:'qr',lbl:'🖨️ QR',h:!isAdmin},
    {id:'changelog',lbl:'📋 ประวัติแก้ไข',h:!isPower},
    {id:'settings',lbl:'⚙️ ตั้งค่า',h:!isAdmin},
  ];

  return (
    <div className="flex flex-col h-full bg-slate-50">
      {/* HEADER */}
      <header className="bg-slate-900 text-white flex flex-col md:flex-row items-center justify-between px-5 py-3 shrink-0 shadow-lg border-b border-slate-800 gap-3">
        <div className="flex items-center gap-3">
          <a href="index.html" className="w-9 h-9 bg-white/10 hover:bg-white/20 rounded-xl flex items-center justify-center font-bold transition-colors">←</a>
          <div className="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center font-black text-xl shadow-lg">S</div>
          <div>
            <h1 className="font-bold text-lg leading-tight">Smart Dock Pro</h1>
            <div className="text-[11px] text-slate-400 flex items-center gap-1.5">
              <span className={`w-2 h-2 rounded-full ${online?'bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]':'bg-amber-400 animate-pulse'}`}/>
              Firebase {online?'ออนไลน์':'กำลังเชื่อมต่อ...'}
            </div>
          </div>
        </div>
        <div className="flex flex-col md:flex-row items-center gap-3 w-full md:w-auto">
          <div className="flex gap-1 overflow-x-auto sh bg-slate-800/50 p-1 rounded-full border border-slate-700/50">
            {TABS.filter(t=>!t.h).map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)}
                className={`whitespace-nowrap text-xs font-semibold py-2 px-3 rounded-full transition-all ${tab===t.id?'bg-white text-indigo-700 shadow-md':'text-slate-300 hover:bg-slate-700 hover:text-white'}`}>
                {t.lbl}
              </button>
            ))}
          </div>
          <div className="flex items-center gap-2">
            <div className="flex items-center border border-slate-700 rounded-lg bg-slate-800 px-3 py-1.5">
              <span className="text-[11px] text-slate-400 mr-2">📅</span>
              <input type="date" value={viewDate} onChange={e=>setViewDate(e.target.value)}
                className="bg-transparent text-white text-xs font-bold focus:outline-none cursor-pointer [&::-webkit-calendar-picker-indicator]:invert"/>
            </div>
            <button onClick={()=>window.open(`dock-tv.html?date=${viewDate}`,'_blank')}
              className="bg-indigo-600 hover:bg-indigo-500 border border-indigo-500 rounded-lg px-3 py-1.5 text-xs font-bold transition-colors">🖥️ TV</button>
            <div className="flex items-center border border-slate-700 rounded-lg bg-slate-800 px-3 py-1.5">
              <span className="text-[11px] text-slate-400 mr-2">สิทธิ์:</span>
              <select value={role} onChange={e=>setRole(e.target.value)} className="bg-transparent text-white text-xs font-bold focus:outline-none cursor-pointer">
                {['Admin','Ship Co','Sup','พนักงาน'].map(r=><option key={r} value={r} className="text-slate-900 bg-white">{r}</option>)}
              </select>
            </div>
          </div>
        </div>
      </header>

      {/* MAIN */}
      <div className="flex-1 overflow-hidden flex flex-col md:flex-row p-4 gap-4">
        {/* Form Panel — only on board tab */}
        {isPower && tab==='board' && (
          <FormPanel form={form} setForm={setForm} bays={bays} settings={settings}
            onSubmit={handleSubmit} editId={editId} onCancelEdit={cancelEdit}/>
        )}

        {/* Right content */}
        <div className="flex-1 flex flex-col min-w-0 h-full overflow-hidden gap-4">

          {/* BOARD */}
          {tab==='board' && (<>
            {/* Waitlist */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 shrink-0 fi">
              <div className="p-3.5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50 rounded-t-2xl">
                <h3 className="font-bold text-slate-800 text-sm">🅿️ Waitlist</h3>
                <span className="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-xs font-bold">{waitlist.length}</span>
              </div>
              <div className="p-4 flex overflow-x-auto sh gap-3">
                {waitlist.map((b,i)=>(
                  <WaitlistCard key={b.id} booking={b} idx={i} isPower={isPower}
                    onEdit={handleEdit} onManifest={printManifest} onCycle={handleCycle}/>
                ))}
                {!waitlist.length && <div className="w-full text-center py-6 text-slate-400 text-sm">Waitlist ว่าง</div>}
              </div>
            </div>

            {/* Dock Board */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden fi">
              <div className="p-4 border-b border-slate-100 flex flex-wrap justify-between items-center gap-3">
                <div className="flex items-center gap-3">
                  <h2 className="font-bold text-lg text-slate-800">🏭 Live Dock Board</h2>
                  {isAdmin && <button onClick={()=>setTab('qr')} className="text-[11px] bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg font-bold border border-slate-200 transition-colors">🖨️ พิมพ์ QR</button>}
                </div>
                <div className="flex gap-3 text-[11px] font-bold text-slate-500 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-100">
                  <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>ว่าง</div>
                  <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>มีรถ</div>
                  <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-amber-400"></span>ปิด</div>
                  <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-red-500 pr"></span>Delay</div>
                </div>
              </div>
              <div className="flex-1 overflow-y-auto ds p-4 bg-slate-50/50">
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                  {bays.map(dock=>{
                    const ab=dockBooks.find(b=>b.allocation===dock.name);
                    if(ab) return <DockCardOccupied key={dock.name} dock={dock} booking={ab} delay={isDelay(ab)}
                      isPower={isPower} onEdit={handleEdit} onManifest={printManifest}
                      onDelete={handleDelete} onCycle={handleCycle}/>;
                    return <DockCardEmpty key={dock.name} dock={dock} canDock={canDock} isAdmin={isAdmin}
                      onToggle={handleToggleBay} onPrintQR={printQR}/>;
                  })}
                </div>
              </div>
            </div>
          </>)}

          {tab==='schedule' && <ScheduleView bays={bays} bookings={bookings} viewDate={viewDate} isPower={isPower} onEdit={handleEdit}/>}
          {tab==='list'     && <ListView bookings={bookings} viewDate={viewDate} completed={false} isPower={isPower} onEdit={handleEdit} onDelete={handleDelete} onManifest={printManifest} onCycle={handleCycle} onExport={exportCSV}/>}
          {tab==='reports'  && <ListView bookings={bookings} viewDate={viewDate} completed={true}  isPower={isPower} onEdit={handleEdit} onDelete={handleDelete} onManifest={printManifest} onCycle={handleCycle} onExport={exportCSV}/>}
          {tab==='scan'     && <ScanView scanOn={scanOn} setScanOn={setScanOn} scanMsg={scanMsg}/>}
          {tab==='qr'       && <QRView bays={bays}/>}
          {tab==='changelog' && <ChangelogView/>}
          {tab==='settings' && <SettingsView settings={settings}/>}
        </div>
      </div>
    </div>
  );
}


const ChangelogView = ()=>{
  const [logs,setLogs]=React.useState([]);
  const [loading,setLoading]=React.useState(true);
  React.useEffect(()=>{
    const ref=rtdb.ref('smartdock/changelog').orderByChild('changedAt').limitToLast(300);
    ref.on('value',snap=>{
      const d=snap.val();
      if(!d){setLogs([]);setLoading(false);return;}
      setLogs(Object.entries(d).map(([k,v])=>({_key:k,...v})).sort((a,b)=>b.changedAt-a.changedAt));
      setLoading(false);
    });
    return()=>ref.off();
  },[]);
  const TC={CREATE:'bg-green-100 text-green-700',EDIT:'bg-amber-100 text-amber-700',STATUS:'bg-sky-100 text-sky-700',UPDATE:'bg-slate-100 text-slate-600'};
  const TL={CREATE:'➕ สร้าง',EDIT:'✏️ แก้ไข',STATUS:'🔄 สถานะ',UPDATE:'💾 บันทึก'};
  if(loading)return<div className="flex-1 flex items-center justify-center text-slate-400 p-8">กำลังโหลด...</div>;
  return(
    <div className="flex-1 overflow-y-auto p-4">
      <div className="max-w-3xl mx-auto">
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-black text-lg text-slate-800">📋 ประวัติการแก้ไข Booking</h2>
          <span className="text-sm text-slate-400">{logs.length} รายการล่าสุด</span>
        </div>
        {!logs.length&&<div className="text-center py-12 text-slate-400">ยังไม่มีประวัติ</div>}
        <div className="space-y-2">
          {logs.map(l=>(
            <div key={l._key} className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
              <div className="flex items-start justify-between gap-2 flex-wrap">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold ${TC[l.type]||'bg-slate-100 text-slate-600'}`}>{TL[l.type]||l.type}</span>
                  <span className="font-bold text-slate-800">{l.shipmentNo||'—'}</span>
                </div>
                <div className="text-xs text-slate-400 text-right shrink-0">
                  <div>{l.date} {l.changedTime}</div>
                  <div className="font-medium text-slate-600">{l.changedBy}</div>
                </div>
              </div>
              <div className="mt-2 space-y-1">
                {(l.changes||[]).map((c,i)=><div key={i} className="text-sm text-slate-600 bg-slate-50 rounded px-3 py-1">• {c}</div>)}
              </div>
              {l.note&&<div className="mt-2 text-sm text-amber-700 bg-amber-50 rounded-lg px-3 py-1.5 border border-amber-200">💬 {l.note}</div>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

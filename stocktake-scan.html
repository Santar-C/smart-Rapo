<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>สแกนนับสต็อก - RAPO</title>
  <link rel="manifest" href="manifest-scan.json">
  <meta name="theme-color" content="#021D49">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family:'Sarabun',sans-serif; overflow-x:hidden; }
    .big-title { font-size:2.05rem; font-weight:900; }
    .big-btn { font-size:1.4rem !important; padding:1.1rem !important; }
    .scan-input-big { box-sizing:border-box !important; width:100% !important; max-width:100% !important; font-size:1.75rem !important; font-weight:700 !important; text-align:center; letter-spacing:0.06em; background:#f0fdf4 !important; border-color:var(--green) !important; padding:1.1rem !important; }
    .chk-list { display:flex; flex-direction:column; gap:0.5rem; max-height:440px; overflow-y:auto; }
    .chk-row { display:flex; align-items:center; gap:0.7rem; padding:0.7rem 0.9rem; border-radius:12px; border:2px solid var(--border); background:white; }
    .chk-row.pending { background:#f8fafc; }
    .chk-row.matched { background:#f0fdf4; border-color:#86efac; }
    .chk-row.over    { background:#fef2f2; border-color:#fca5a5; }
    .chk-row .tick { width:34px; height:34px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:1.35rem; cursor:pointer; background:#e2e8f0; color:#94a3b8; }
    .chk-row .tag  { font-family:monospace; font-weight:700; flex:1; font-size:1.25rem; }
    .chk-row .name { font-size:1.02rem; color:var(--gray); }
    .chk-row .cnt  { font-size:1.2rem; font-weight:900; padding:0.2rem 0.65rem; border-radius:8px; background:#e0e7ff; color:#4338ca; white-space:nowrap; }
    .chk-row.over .cnt { background:#fee2e2; color:#dc2626; }
    .stepper { display:flex; align-items:center; gap:0.5rem; }
    .stepper button { width:46px; height:46px; border-radius:50%; border:2px solid var(--border); background:white; font-weight:900; font-size:1.5rem; cursor:pointer; flex-shrink:0; }
    .qty-direct { width:70px; text-align:center; font-size:1.35rem; font-weight:900; padding:0.4rem 0.2rem; border:2px solid var(--indigo); border-radius:8px; color:var(--indigo); -moz-appearance:textfield; }
    .qty-direct::-webkit-outer-spin-button, .qty-direct::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
    .qty-target { font-size:1.35rem; font-weight:700; color:var(--gray); white-space:nowrap; }
    .cam-aim-line { position:absolute; left:8%; right:8%; top:50%; height:3px; background:#ef4444; box-shadow:0 0 8px 2px rgba(239,68,68,0.7); transform:translateY(-50%); pointer-events:none; z-index:2; }
    .cam-aim-line::before, .cam-aim-line::after { content:""; position:absolute; top:-14px; width:3px; height:14px; background:#ef4444; }
    .cam-aim-line::before { left:0; } .cam-aim-line::after { right:0; }
    .progress-wrap { display:flex; align-items:center; gap:1.25rem; }
    .ring-svg { transform:rotate(-90deg); }
    .ring-num { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    #toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(100px); background:#1e293b; color:white; padding:0.85rem 1.5rem; border-radius:12px; font-size:1.25rem; font-weight:600; z-index:9999; transition:transform 0.3s; box-shadow:0 8px 24px rgba(0,0,0,0.2); white-space:nowrap; }
    #toast.show { transform:translateX(-50%) translateY(0); }
    #toast.err  { background:#dc2626; }
    #toast.ok   { background:#16a34a; }
    #reader__dashboard_section_csr, #reader__dashboard_section_swaplink { display:none !important; }
  </style>
</head>
<body>
<div class="page-body" style="max-width:520px;margin:0 auto;padding:1rem;">

  <!-- ═══ SCREEN: PICK STAFF → ZONE → LOCATION ═══ -->
  <div id="screen-start">
    <div class="card" style="text-align:center;">
      <div class="big-title" style="color:var(--blue);">📝 นับสต็อก</div>
    </div>

    <div class="card">
      <label style="font-size:1.25rem;font-weight:700;">1️⃣ คุณคือใคร?</label>
      <select id="staff-select" style="width:100%;padding:0.85rem;border:2px solid var(--border);border-radius:10px;font-family:Sarabun,sans-serif;font-size:1.4rem;font-weight:700;margin-top:0.5rem;">
        <option value="">-- กำลังโหลด... --</option>
      </select>
    </div>

    <div class="card">
      <label style="font-size:1.25rem;font-weight:700;">2️⃣ สแกนบาร์โค้ด Location ที่ติดอยู่หน้าช่อง</label>
      <input type="text" id="loc-barcode-input" placeholder="ยิงบาร์โค้ด Location ตรงนี้ (ปืนยิง)"
        autocomplete="off" autocorrect="off" spellcheck="false" class="scan-input-big" style="margin-top:0.5rem;">
      <button class="btn btn-outline btn-full big-btn" id="btn-use-qr" style="margin-top:0.6rem;">📷 หรือเปิดกล้องสแกนแทน (ถ้ามี)</button>
      <div style="font-size:1.05rem;color:var(--gray);margin-top:0.5rem;text-align:center;">หรือเลือกเองด้านล่าง ↓</div>
    </div>

    <div class="card">
      <label style="font-size:1.25rem;font-weight:700;">เลือกโซนเอง</label>
      <select id="area-select" style="width:100%;padding:0.85rem;border:2px solid var(--border);border-radius:10px;font-family:Sarabun,sans-serif;font-size:1.4rem;font-weight:700;margin-top:0.5rem;">
        <option value="">-- กำลังโหลด... --</option>
      </select>
    </div>

    <div class="card" id="loc-select-card" style="display:none;">
      <label style="font-size:1.25rem;font-weight:700;">เลือก Location เอง</label>
      <select id="loc-select" style="width:100%;padding:0.85rem;border:2px solid var(--border);border-radius:10px;font-family:Sarabun,sans-serif;font-size:1.4rem;font-weight:700;margin-top:0.5rem;">
        <option value="">-- เลือกโซนก่อน --</option>
      </select>
      <div style="font-size:1.1rem;color:var(--gray);margin-top:0.5rem;" id="loc-sub"></div>
    </div>

    <button class="btn btn-primary btn-full big-btn" id="btn-begin" style="margin-bottom:1rem;">▶ เริ่มนับ</button>
  </div>

  <!-- ═══ SCREEN: CHECKLIST (นับ) ═══ -->
  <div id="screen-scan" style="display:none">
    <div id="offline-badge" style="display:none;align-items:center;gap:0.5rem;padding:0.55rem 0.9rem;border-radius:10px;color:white;font-weight:700;font-size:1.1rem;margin-bottom:0.6rem;"></div>
    <div class="card" style="position:sticky;top:0.5rem;z-index:50;margin-bottom:0.75rem;padding:0.9rem 1.25rem;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;">
        <div>
          <div style="font-size:1.25rem;color:var(--gray);" id="scan-who"></div>
          <div class="big-title" style="color:var(--blue);" id="scan-loc-title">—</div>
        </div>
        <span class="badge" id="scan-zone-badge" style="font-size:1.1rem;padding:0.35rem 0.8rem;">—</span>
      </div>
    </div>

    <div class="card" style="margin-bottom:0.75rem;padding:0.9rem 1.25rem;">
      <div class="progress-wrap">
        <div style="position:relative;width:110px;height:110px;flex-shrink:0;">
          <svg width="110" height="110" viewBox="0 0 100 100" class="ring-svg">
            <circle cx="50" cy="50" r="43" fill="none" stroke="#e2e8f0" stroke-width="10"/>
            <circle cx="50" cy="50" r="43" fill="none" stroke="#16a34a" stroke-width="10"
              id="ring-dash" stroke-dasharray="270" stroke-dashoffset="270"
              stroke-linecap="round" style="transition:all 0.5s ease;"/>
          </svg>
          <div class="ring-num">
            <div style="font-size:1.9rem;font-weight:900;line-height:1;color:var(--green);" id="ring-n">0</div>
            <div style="font-size:1.05rem;color:var(--gray);">/<span id="ring-e">?</span></div>
          </div>
        </div>
        <div style="flex:1;">
          <div id="zone-hint" style="font-size:1.05rem;font-weight:700;"></div>
          <div id="over-hint" style="display:none;margin-top:0.4rem;color:var(--red);font-weight:900;font-size:1.25rem;">🔺 ของเกิน <span id="over-count">0</span> ชิ้น</div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:0.75rem;">
      <input type="text" id="tag-input" placeholder="สแกนบาร์โค้ดตรงนี้ (ปืนยิง) หรือแตะ 📷"
        autocomplete="off" autocorrect="off" spellcheck="false" class="scan-input-big">
      <button class="btn btn-outline btn-full big-btn" id="btn-toggle-cam" style="margin-top:0.6rem;">📷 เปิดกล้องสแกน</button>
    </div>

    <div class="card" style="margin-bottom:0.75rem;">
      <div class="card-title" style="font-size:1.25rem;margin-bottom:0.75rem;">✅ รายการที่ต้องนับ</div>
      <div class="chk-list" id="chk-list"></div>
    </div>

    <button class="btn btn-outline btn-full big-btn" id="btn-report-over" style="margin-bottom:0.6rem;">🔺 เจอของเกิน (ไม่มีในรายการ)</button>
    <button class="btn btn-outline btn-full big-btn" id="btn-wrong-location" style="margin-bottom:0.6rem;color:var(--red);border-color:var(--red);">❌ กดผิด Location — แจ้ง Admin</button>
    <button class="btn btn-green btn-full big-btn" id="btn-finish-job" style="margin-bottom:1rem;">🏁 นับเสร็จ — โลนี้จบ</button>
  </div>

  <!-- ═══ SCREEN: DONE → ต่อ QR ถัดไปได้เลย ═══ -->
  <!-- ═══ MODAL: แจ้งของเกิน (Over) — รหัส + เหตุผล + รูปถ่าย (ไม่บังคับ) ═══ -->
  <div id="over-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9998;align-items:center;justify-content:center;padding:1rem;">
    <div class="card" style="max-width:420px;width:100%;margin:0;">
      <div style="font-weight:900;font-size:1.35rem;color:var(--red);margin-bottom:0.8rem;">🔺 แจ้งของเกิน</div>
      <div class="form-group">
        <label>รหัส Tag / Barcode</label>
        <input type="text" id="over-modal-tag" placeholder="สแกนหรือพิมพ์รหัส" class="scan-input-big" style="font-size:1.35rem !important;">
      </div>
      <div class="form-group">
        <label>สาเหตุ (เลือกถ้าพอทราบ)</label>
        <select id="over-modal-reason" style="width:100%;padding:0.7rem;border:2px solid var(--border);border-radius:10px;font-family:Sarabun,sans-serif;font-size:1.25rem;">
          <option value="">-- ไม่ระบุ --</option>
          <option value="วางผิด location">📍 วางผิด Location</option>
          <option value="เอกสาร/waybill ผิด">📄 เอกสาร/Waybill ผิด</option>
          <option value="รอ QC">🔍 รอ QC</option>
          <option value="ของเกินจากรอบก่อน">🔁 ของเกินจากรอบก่อน</option>
          <option value="อื่นๆ">❓ อื่นๆ</option>
        </select>
      </div>
      <div class="form-group">
        <label>📷 ถ่ายรูปแนบ (ไม่บังคับ)</label>
        <input type="file" id="over-modal-photo" accept="image/*" capture="environment">
        <div id="over-modal-photo-preview" style="margin-top:0.5rem;display:none;"><img style="max-width:100%;border-radius:8px;max-height:160px;"></div>
      </div>
      <div style="display:flex;gap:0.6rem;margin-top:0.5rem;">
        <button class="btn btn-outline" id="over-modal-cancel" style="flex:1;">ยกเลิก</button>
        <button class="btn btn-primary" id="over-modal-confirm" style="flex:2;background:var(--red);border:none;">🔺 บันทึกของเกิน</button>
      </div>
    </div>
  </div>

  <div id="screen-done" style="display:none">
    <div class="card" style="text-align:center;padding:1.5rem;">
      <div style="font-size:2.8rem;margin-bottom:0.4rem;" id="done-icon">🎉</div>
      <div class="big-title" style="color:var(--blue);">นับเสร็จแล้ว</div>
      <div style="font-size:1.15rem;color:var(--gray);margin-top:0.5rem;" id="done-detail"></div>
      <div style="font-size:1.2rem;color:var(--indigo);font-weight:700;margin-top:0.7rem;" id="done-encourage"></div>
    </div>
    <button class="btn btn-primary btn-full big-btn" id="btn-next-location" style="margin-bottom:0.6rem;">➕ นับ Location ถัดไป</button>
    <button class="btn btn-outline btn-full" id="btn-next-qr" style="margin-bottom:1rem;">📷 หรือสแกน QR แทน (ถ้ามี)</button>
  </div>

  <!-- กล้องสแกน (ใช้ร่วมกัน 3 จุด) — วางไว้นอกทุก screen div โดยตั้งใจ
       ไม่งั้นถ้า screen ที่ครอบมัน display:none กล้องจะโดนซ่อนไปด้วยทั้งที่สั่งเปิดแล้ว -->
  <div id="cam-modal" style="display:none;position:fixed;inset:0;background:#000;z-index:9999;flex-direction:column;align-items:center;justify-content:center;padding:1rem;">
    <div style="position:relative;width:100%;max-width:460px;">
      <div id="cam-reader" style="width:100%;min-height:280px;border-radius:12px;overflow:hidden;background:#000;"></div>
      <div class="cam-aim-line"></div>
    </div>
    <div style="color:white;font-size:1.15rem;font-weight:700;margin-top:1rem;text-align:center;">เล็งให้เส้นแดงทับกลางบาร์โค้ด</div>
    <button class="btn btn-full big-btn" id="btn-stop-cam" style="margin-top:1rem;max-width:460px;background:white;color:#1e293b;border:none;">✕ ปิดกล้อง</button>
  </div>

</div>
<div id="toast">—</div>

<script type="module">
  import { auth, db, storage } from "./firebase-config.js";
  import { ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
  import { signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    collection, doc, addDoc, updateDoc, deleteDoc, getDocs, getDoc, setDoc,
    query, where, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const CIRC = 2 * Math.PI * 43;
  const Z  = {"Normal":"badge-blue","Zone B":"badge-purple","Overflow":"badge-orange"};
  const ZL = {"Normal":"Normal Zone","Zone B":"Zone B","Overflow":"Overflow"};
  function isBulkZone(zone) { return zone === "Zone B" || zone === "Overflow"; }
  const LAST_STAFF_KEY = "rapo_stocktake_last_staff";

  // ══ OFFLINE QUEUE (IndexedDB) ═══════════════════════════════
  // แก้ปัญหาสัญญาณหลุดกลางโกดัง (มุมอับสัญญาณ): ถ้าเขียน Firestore ไม่ได้
  // ให้เก็บ operation ไว้ใน IndexedDB ก่อน แล้ว sync อัตโนมัติเมื่อกลับมามีเน็ต
  // โดย UI ของพนักงานยังทำงานต่อได้ปกติ (optimistic update) ไม่สะดุด
  const QDB_NAME = "rapo_stocktake_queue", QSTORE = "ops";
  function openQueueDB() {
    return new Promise((resolve,reject) => {
      const req = indexedDB.open(QDB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(QSTORE, {keyPath:"id"}); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function queuePut(item) {
    const idb = await openQueueDB();
    return new Promise((resolve,reject) => {
      const tx = idb.transaction(QSTORE,"readwrite");
      tx.objectStore(QSTORE).put(item);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function queueDelete(id) {
    const idb = await openQueueDB();
    return new Promise((resolve,reject) => {
      const tx = idb.transaction(QSTORE,"readwrite");
      tx.objectStore(QSTORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function queueGetAll() {
    const idb = await openQueueDB();
    return new Promise((resolve,reject) => {
      const tx = idb.transaction(QSTORE,"readonly");
      const req = tx.objectStore(QSTORE).getAll();
      req.onsuccess = () => resolve(req.result||[]);
      req.onerror = () => reject(req.error);
    });
  }

  let flushingQueue = false;
  async function flushQueue() {
    if (flushingQueue || !navigator.onLine) return;
    flushingQueue = true;
    try {
      const items = (await queueGetAll()).sort((a,b)=>a.ts-b.ts);
      for (const item of items) {
        try {
          if (item.type === "add_detail") {
            const ref = await addDoc(collection(db,"count_details"), {...item.data, timestamp: serverTimestamp()});
            const idx = scanEvents.findIndex(e=>e.docId===item.id);
            if (idx>-1) scanEvents[idx] = {...scanEvents[idx], docId:ref.id, _pending:false};
          } else if (item.type === "delete_detail") {
            await deleteDoc(doc(db,"count_details", item.data.realDocId));
          } else if (item.type === "update_progress" || item.type === "finish_job") {
            const fields = {...item.data.fields};
            Object.keys(fields).forEach(k => { if (fields[k] === "__SERVER_TIMESTAMP__") fields[k] = serverTimestamp(); });
            await updateDoc(doc(db,"count_jobs", item.data.jobId), fields);
          } else if (item.type === "set_qty") {
            await setDoc(doc(db,"count_details", item.id), {...item.data.payload, timestamp: serverTimestamp()});
          }
          await queueDelete(item.id);
        } catch (err) { break; } // ยังออฟไลน์จริงๆ อยู่ — หยุดรอบนี้ ลองใหม่รอบหน้า
      }
    } finally {
      flushingQueue = false;
      updateOfflineBadge();
      if (document.getElementById("screen-scan").style.display !== "none") renderChecklist();
    }
  }
  window.addEventListener("online", flushQueue);
  window.addEventListener("offline", updateOfflineBadge);
  setInterval(flushQueue, 15000);

  async function updateOfflineBadge() {
    const badge = document.getElementById("offline-badge");
    if (!badge) return;
    let items = [];
    try { items = await queueGetAll(); } catch(e) {}
    if (!navigator.onLine) {
      badge.style.display="flex"; badge.style.background="#dc2626";
      badge.textContent = `📴 ออฟไลน์ — ข้อมูลจะ sync อัตโนมัติเมื่อมีเน็ต (ค้าง ${items.length} รายการ)`;
    } else if (items.length>0) {
      badge.style.display="flex"; badge.style.background="#f59e0b";
      badge.textContent = `🔄 กำลัง sync ข้อมูลที่ค้างไว้... (เหลือ ${items.length})`;
      flushQueue();
    } else {
      badge.style.display="none";
    }
  }
  setInterval(updateOfflineBadge, 5000);


  let toastTimer;
  function toast(msg, cls="", dur=2200) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.className = cls ? `show ${cls}` : "show";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.className="", dur);
  }

  // ── Anonymous sign-in อัตโนมัติ ไม่ต้องมี UI login ─────────
  const currentUser = await new Promise((resolve) => {
    onAuthStateChanged(auth, user => {
      if (user) { resolve(user); return; }
      signInAnonymously(auth).catch(err => toast("❌ เข้าระบบไม่ได้: "+err.message, "err"));
    });
  });

  let selLoc  = "";
  let scanEvents = [], qtyByTag = {}, curJob = null, staffList = [];
  let allLocations = []; // [{location, zone, count}]
  let camStarted = false, html5Cam = null, lastScan = 0;

  // เผื่อ QR encode เป็น URL เต็มแทนที่จะเป็นแค่รหัส location
  function extractLocFromScan(text) {
    try {
      const u = new URL(text);
      const l = u.searchParams.get("loc");
      if (l) return l;
    } catch(e) {}
    return text;
  }

  function deriveArea(loc) { return (loc.split("-")[0]||"").toUpperCase(); }
  function areaGroup(area) {
    if (area.startsWith("B")) return "🟣 โซน B (Bulk — ติ๊กเจอ)";
    if (area.startsWith("OVERFL")) return "🟠 Overflow (Bulk — ติ๊กเจอ)";
    if (area.startsWith("A")) return "🔵 โซน A (นับจำนวนจริง)";
    if (area.startsWith("C")) return "🔵 โซน C (นับจำนวนจริง)";
    return "⚪ อื่นๆ";
  }

  const INDEX_CACHE_KEY = "rapo_location_index_cache_v1";
  const BARCODE_MAP_CACHE_KEY = "rapo_barcode_map_cache_v1";
  let barcodeMap = {}; // { "asdfth": "A01-01-1-10", ... } — จาก WMS

  async function init() {
    const roundId = await getCurrentRoundId();

    // ── โหลด "location_index" เอกสารเดียว (location+zone+count) แทน master_stock
    // เต็ม 5,862+ แถว — ลด read จากหลักพันเหลือแค่ 1 ต่อเครื่อง ─────────────
    // sessionStorage cache ไว้ช่วยกรณีเปิดหน้าซ้ำในเซสชันเดียวกัน (cache หมดอายุอัตโนมัติเมื่อเริ่มรอบใหม่)
    let cached = null;
    try {
      const raw = sessionStorage.getItem(INDEX_CACHE_KEY);
      if (raw) { const parsed = JSON.parse(raw); if (parsed.roundId === roundId) cached = parsed; }
    } catch (e) {}

    if (cached) {
      allLocations = cached.locations;
    } else {
      const snap = await getDoc(doc(db,"location_index","current"));
      allLocations = (snap.exists() ? (snap.data().locations||[]) : []).slice().sort((a,b)=>a.location.localeCompare(b.location));
      try { sessionStorage.setItem(INDEX_CACHE_KEY, JSON.stringify({roundId, locations: allLocations})); } catch(e) {}
    }

    // ── โหลดตารางเทียบ "บาร์โค้ด WMS" ↔ "รหัส Location ที่คนอ่าน" (1 read, cache เหมือนกัน) ──
    let bmCached = null;
    try {
      const raw = sessionStorage.getItem(BARCODE_MAP_CACHE_KEY);
      if (raw) { const parsed = JSON.parse(raw); if (parsed.roundId === roundId) bmCached = parsed; }
    } catch (e) {}
    if (bmCached) {
      barcodeMap = bmCached.map;
    } else {
      try {
        const bmSnap = await getDoc(doc(db,"location_barcode_map","current"));
        barcodeMap = bmSnap.exists() ? (bmSnap.data().map || {}) : {};
      } catch (e) { barcodeMap = {}; }
      try { sessionStorage.setItem(BARCODE_MAP_CACHE_KEY, JSON.stringify({roundId, map: barcodeMap})); } catch(e) {}
    }

    // สร้างกลุ่มโซน (Area) เรียงตามหมวดแล้วเรียงชื่อในหมวด
    const areaMap = {};
    allLocations.forEach(l => {
      const area = deriveArea(l.location);
      if (!areaMap[area]) areaMap[area] = { area, group:areaGroup(area), count:0 };
      areaMap[area].count++;
    });
    const areas = Object.values(areaMap).sort((a,b)=> a.group.localeCompare(b.group) || a.area.localeCompare(b.area));
    const groups = {};
    areas.forEach(a => { (groups[a.group] = groups[a.group]||[]).push(a); });

    const areaSel = document.getElementById("area-select");
    areaSel.innerHTML = `<option value="">-- เลือกโซน --</option>` +
      Object.keys(groups).sort().map(g => `<optgroup label="${g}">` +
        groups[g].map(a=>`<option value="${a.area}">${a.area} (${a.count} location)</option>`).join("") +
        `</optgroup>`
      ).join("");

    // รายชื่อพนักงาน
    const staffSnap = await getDocs(query(collection(db,"staff_list"), orderBy("name")));
    staffList = staffSnap.docs.map(d=>d.data().name);
    const staffSel = document.getElementById("staff-select");
    staffSel.innerHTML = staffList.length
      ? `<option value="">-- เลือกชื่อ --</option>` + staffList.map(n=>`<option value="${n}">${n}</option>`).join("")
      : `<option value="">(ยังไม่มีรายชื่อ — แจ้ง Admin)</option>`;
    const last = localStorage.getItem(LAST_STAFF_KEY);
    if (last && staffList.includes(last)) staffSel.value = last;

    // ถ้าเข้ามาด้วย ?loc= (เช่น QR เก่าที่พิมพ์ไว้แล้ว) ให้ pre-select ให้เลย
    const params = new URLSearchParams(location.search);
    const preLoc = (params.get("loc")||"").trim().toUpperCase();
    if (preLoc) selectLocation(preLoc);
  }
  init();
  setTimeout(()=>document.getElementById("loc-barcode-input")?.focus(), 300);

  // เรียง location แบบแนวเดิน (ซิกแซก) — จัดกลุ่มตาม prefix (ตัดเลข 2 ตัวท้ายออก = แถว/ช่องเดียวกัน)
  // แล้วเรียงในกลุ่มตามความสูง (เลข 2 ตัวท้าย) สลับทิศ ขึ้น-ลง-ขึ้น-ลง ทีละกลุ่ม ให้เดินเป็นเส้นเดียวไม่ย้อนกลับ
  function sortLocationsSnake(locs) {
    const groups = {};
    locs.forEach(l => {
      const prefix = l.location.length > 2 ? l.location.slice(0, -2) : l.location;
      const heightNum = parseInt(l.location.slice(-2), 10);
      if (!groups[prefix]) groups[prefix] = [];
      groups[prefix].push({ ...l, _height: isNaN(heightNum) ? 0 : heightNum });
    });
    const prefixes = Object.keys(groups).sort((a,b)=>a.localeCompare(b, undefined, {numeric:true}));
    const result = [];
    prefixes.forEach((prefix, idx) => {
      const group = groups[prefix].sort((a,b)=>a._height-b._height);
      if (idx % 2 === 1) group.reverse(); // สลับทิศทุกแถว (ซิกแซก) กันเดินย้อนกลับ
      result.push(...group);
    });
    return result;
  }

  document.getElementById("area-select").addEventListener("change", () => {
    const area = document.getElementById("area-select").value;
    const locSel = document.getElementById("loc-select");
    const card = document.getElementById("loc-select-card");
    if (!area) { card.style.display="none"; return; }
    const locs = sortLocationsSnake(allLocations.filter(l => deriveArea(l.location)===area));
    locSel.innerHTML = `<option value="">-- เลือก Location --</option>` +
      locs.map(l=>`<option value="${l.location}">${l.location} (${l.count} รายการ)</option>`).join("");
    card.style.display = "block";
    document.getElementById("loc-sub").textContent = `${locs.length} location ในโซนนี้`;
  });
  document.getElementById("loc-select").addEventListener("change", () => {
    selLoc = document.getElementById("loc-select").value;
  });

  // เลือก location ให้ตรงกับ dropdown อัตโนมัติ (ใช้ตอนมี ?loc= หรือสแกน QR)
  function selectLocation(code) {
    const loc = allLocations.find(l=>l.location===code);
    if (!loc) { toast(`⚠️ ไม่พบ location "${code}" — เช็คว่ามีในตารางเทียบบาร์โค้ด/Master หรือยัง`, "err", 3500); return; }
    document.getElementById("area-select").value = deriveArea(code);
    document.getElementById("area-select").dispatchEvent(new Event("change"));
    setTimeout(() => {
      document.getElementById("loc-select").value = code;
      selLoc = code;
    }, 30);
    toast(`📍 เลือก ${code} แล้ว — กด "เริ่มนับ" ได้เลย`, "ok");
  }

  // ── ยิงบาร์โค้ด Location ที่ติดหน้าช่อง (บาร์โค้ดทั่วไป ปืนยิงพิมพ์เป็นข้อความ ไม่ใช่ QR) ──
  function resolveAndSelectLocation(raw) {
    const code = extractLocFromScan(raw).trim().toUpperCase();
    // แปลงบาร์โค้ด WMS → รหัส location ที่คนอ่าน ถ้ามีในตารางเทียบ
    // ถ้าไม่เจอในตาราง ลองใช้ค่าที่พิมพ์/สแกนมาตรงๆ (เผื่อพิมพ์รหัส location เองหรือ QR เก่า)
    selectLocation(barcodeMap[code] || code);
  }

  document.getElementById("loc-barcode-input").addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      const v = e.target.value.trim().toUpperCase();
      e.target.value = "";
      if (v) resolveAndSelectLocation(v);
    }
  });

  document.getElementById("btn-use-qr").addEventListener("click", () => {
    openCam(text => resolveAndSelectLocation(text), true);
  });

  document.getElementById("btn-begin").addEventListener("click", async () => {
    const name = document.getElementById("staff-select").value;
    if (!name) { toast("⚠️ เลือกชื่อก่อนนะครับ/ค่ะ"); return; }
    if (!selLoc) { toast("⚠️ เลือกโซนและ location ก่อนนะครับ/ค่ะ"); return; }
    if (!navigator.onLine) { toast("📴 ต้องมีเน็ตตอนเริ่มนับ Location ใหม่ครั้งแรก — เชื่อมต่อแล้วลองใหม่ครับ/ค่ะ", "err", 4000); return; }
    localStorage.setItem(LAST_STAFF_KEY, name);
    const btn = document.getElementById("btn-begin");
    const orig = btn.textContent;
    btn.disabled = true; btn.textContent = "⏳ กำลังเริ่ม...";
    try {
      await beginCounting(name, selLoc);
    } catch (err) {
      toast("❌ เริ่มนับไม่สำเร็จ (เช็คสัญญาณเน็ต): "+err.message, "err", 5000);
    } finally {
      btn.disabled = false; btn.textContent = orig;
    }
  });

  async function getCurrentRoundId() {
    try {
      const snap = await getDoc(doc(db,"app_settings","stocktake_round"));
      return snap.exists() ? snap.data().round_id : null;
    } catch (e) { return null; }
  }

  async function beginCounting(name, locCode) {
    // ดึงเฉพาะ tag ของ location นี้จริงๆ (ปกติมีแค่ 1-5 รายการ) แทนการโหลด master_stock ทั้งหมด
    const locSnap = await getDocs(query(collection(db,"master_stock"), where("location","==",locCode)));
    const allRows = locSnap.docs.map(d=>({id:d.id,...d.data()}));
    // ตัดแถว placeholder (location ว่าง ไม่มีของ) ออก ไม่ให้ขึ้นเป็นรายการต้องสแกน
    const locRows = allRows.filter(r => !r.is_placeholder);
    const roundId = await getCurrentRoundId();
    const existing = await getDocs(query(
      collection(db,"count_jobs"), where("location_scan","==",locCode), where("count_status","==","In Progress"),
      where("round_id","==",roundId)
    ));
    if (!existing.empty) {
      const j = existing.docs[0];
      const jd = j.data();
      const dd = await getDocs(query(collection(db,"count_details"), where("job_id","==",j.id), orderBy("timestamp")));
      const allDocs = dd.docs.map(d=>({docId:d.id,...d.data()}));
      qtyByTag = {};
      allDocs.forEach(d => { if (d.qty !== undefined) qtyByTag[d.scanned_tag] = d.qty; });
      scanEvents = allDocs; // เก็บไว้ทั้งหมด — ใช้กับ Over/extra detection และโซน Bulk เหมือนเดิม
      curJob = { id:j.id, location:locCode, zone:jd.zone_type, createdName: jd.created_name, rows: locRows };
    } else {
      const zone = allRows[0]?.zone || "Normal";
      const ref = await addDoc(collection(db,"count_jobs"), {
        location_scan: locCode, zone_type: zone,
        start_time: serverTimestamp(), count_status: "In Progress",
        expected_target: locRows.length, matched_count: 0, short_count: 0, over_count: 0,
        round_id: roundId,
        created_by: currentUser.uid, created_name: name
      });
      scanEvents = []; qtyByTag = {};
      curJob = { id: ref.id, location: locCode, zone, createdName: name, rows: locRows };
    }
    showScanScreen();
  }

  document.getElementById("btn-next-location").addEventListener("click", () => {
    document.getElementById("screen-done").style.display  = "none";
    document.getElementById("screen-start").style.display  = "block";
    document.getElementById("loc-select-card").style.display = "none";
    document.getElementById("area-select").value = "";
    selLoc = ""; curJob = null; scanEvents = []; qtyByTag = {};
    setTimeout(()=>document.getElementById("loc-barcode-input")?.focus(), 100);
  });
  document.getElementById("btn-next-qr").addEventListener("click", () => {
    openCam(text => {
      document.getElementById("screen-done").style.display  = "none";
      document.getElementById("screen-start").style.display = "block";
      resolveAndSelectLocation(text);
    }, true);
  });

  function masterRows() { return curJob?.rows || []; }
  function targetFor(row) { return isBulkZone(curJob.zone) ? 1 : (row.qty_system ?? null); }
  function countFor(tag) {
    if (!isBulkZone(curJob.zone)) return qtyByTag[tag] || 0;
    return scanEvents.filter(e=>e.scanned_tag===tag).length;
  }

  // ── ตั้งจำนวนตรงๆ สำหรับโซน Normal (พิมพ์เลขได้เลย ไม่ต้องกด + ทีละครั้งเวลาจำนวนเยอะๆ) ──
  async function setQtyForTag(tag, qty) {
    qty = Math.max(0, Math.round(Number(qty)||0));
    qtyByTag[tag] = qty; // optimistic — ใช้ได้ทันทีไม่ว่าออนไลน์หรือไม่
    const docId = curJob.id + "__" + tag;
    const timeStr = new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
    const payload = { job_id: curJob.id, scanned_tag: tag, qty, scan_time: timeStr };
    try {
      if (!navigator.onLine) throw new Error("offline");
      await setDoc(doc(db,"count_details",docId), {...payload, timestamp: serverTimestamp()});
    } catch (err) {
      await queuePut({ id: docId, type:"set_qty", data:{payload}, ts:Date.now() });
    }
    updateOfflineBadge();
  }

  function checklistStats() {
    const rows = masterRows();
    let matched=0, overRows=0;
    rows.forEach(r => {
      const c=countFor(r.tag_barcode), t=targetFor(r);
      if (t==null) return;
      if (c===t) matched++; else if (c>t) overRows++;
    });
    const extraTags = new Set(scanEvents.filter(e=>!rows.some(r=>r.tag_barcode===e.scanned_tag)).map(e=>e.scanned_tag)).size;
    return { total: rows.length, matched, over: overRows+extraTags };
  }

  function showScanScreen() {
    document.getElementById("screen-start").style.display = "none";
    document.getElementById("screen-scan").style.display  = "block";
    document.getElementById("scan-loc-title").textContent = curJob.location;
    document.getElementById("scan-who").textContent = `👤 ${curJob.createdName}`;
    const badge = document.getElementById("scan-zone-badge");
    badge.textContent = ZL[curJob.zone]||curJob.zone;
    badge.className   = `badge ${Z[curJob.zone]||"badge-gray"}`;
    document.getElementById("zone-hint").innerHTML = isBulkZone(curJob.zone)
      ? `🟣 เจอ tag ไหน สแกนเลย — ติ๊กให้อัตโนมัติ`
      : `🔵 ยิงบาร์โค้ดซ้ำทีละชิ้น ระบบนับให้`;
    renderChecklist(); updateProgress(); updateOfflineBadge();
    setTimeout(()=>document.getElementById("tag-input").focus(), 200);
  }

  function renderChecklist() {
    const rows = [...masterRows()].sort((a,b)=>a.tag_barcode.localeCompare(b.tag_barcode, undefined, {numeric:true, sensitivity:"base"}));
    const el = document.getElementById("chk-list");
    el.innerHTML = rows.length ? rows.map(r => {
      const c=countFor(r.tag_barcode), t=targetFor(r);
      const cls = (t==null) ? (c>0?"matched":"pending") : (c===t ? "matched" : (c>t ? "over":"pending"));
      const tickIcon = cls==="matched" ? "✓" : cls==="over" ? "!" : "";
      const hasPending = scanEvents.some(e=>e.scanned_tag===r.tag_barcode && e._pending);
      const stepper = isBulkZone(curJob.zone)
        ? `<div class="tick" onclick="toggleTick('${r.tag_barcode}')" style="background:${cls==='matched'?'#16a34a':cls==='over'?'#dc2626':'#e2e8f0'};color:${cls==='pending'?'#94a3b8':'white'};">${tickIcon}</div>`
        : `<div class="stepper">
             <button onclick="stepQty('${r.tag_barcode}',-1)">−</button>
             <input type="number" inputmode="numeric" class="qty-direct" value="${c}"
               onfocus="this.select()"
               onkeydown="if(event.key==='Enter'){this.blur();}"
               onchange="applyQtyInput('${r.tag_barcode}', this.value)">
             <button onclick="stepQty('${r.tag_barcode}',1)">+</button>
             ${t!=null?`<span class="qty-target">/ ${t}</span>`:""}
           </div>`;
      return `<div class="chk-row ${cls}">
        <div style="flex:1;min-width:0;"><div class="tag">${r.tag_barcode}${hasPending?' <span style="font-size:1.25rem;color:var(--amber);">⏳ รอ sync</span>':''}</div>${(r.sku||r.item_name)?`<div class="name">${r.sku?`<b>${r.sku}</b>`:""}${r.sku&&r.item_name?" — ":""}${r.item_name||""}</div>`:""}</div>
        ${stepper}
      </div>`;
    }).join("") : `<div style="text-align:center;color:var(--gray);font-size:1.25rem;padding:1rem 0;">ไม่มีรายการที่ต้องนับที่นี่</div>`;
  }

  async function removeScanEvent(e) {
    if (e.docId.startsWith("local_")) {
      // ยังไม่เคย sync เลย แค่ยกเลิก operation ที่ค้างอยู่ใน queue
      try { await queueDelete(e.docId); } catch(err) {}
    } else {
      try {
        if (!navigator.onLine) throw new Error("offline");
        await deleteDoc(doc(db,"count_details", e.docId));
      } catch (err) {
        await queuePut({ id:"del_"+e.docId, type:"delete_detail", data:{realDocId:e.docId}, ts:Date.now() });
      }
    }
  }

  window.toggleTick = async (tag) => {
    if (countFor(tag) > 0) {
      const evs = scanEvents.filter(e=>e.scanned_tag===tag);
      for (const e of evs) await removeScanEvent(e);
      scanEvents = scanEvents.filter(e=>e.scanned_tag!==tag);
    } else { await commitScan(tag); }
    await syncJobProgress(); renderChecklist(); updateProgress(); updateOfflineBadge();
  };
  window.stepQty = async (tag, delta) => {
    const next = Math.max(0, (qtyByTag[tag]||0) + delta);
    await setQtyForTag(tag, next);
    await syncJobProgress(); renderChecklist(); updateProgress();
  };
  // พิมพ์จำนวนตรงๆ (กด Enter หรือออกจากช่อง) — ไม่ต้องกด + ทีละครั้งเวลาจำนวนเยอะๆ
  window.applyQtyInput = async (tag, val) => {
    await setQtyForTag(tag, val);
    await syncJobProgress(); renderChecklist(); updateProgress();
  };

  async function commitScan(tag, extra) {
    const timeStr = new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
    const data = { job_id: curJob.id, scanned_tag: tag, scan_time: timeStr, ...(extra||{}) };
    const localId = "local_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
    scanEvents.push({docId:localId, ...data, _pending:true}); // optimistic — UI ทำงานต่อได้ทันทีไม่ว่าจะออนไลน์หรือไม่
    try {
      if (!navigator.onLine) throw new Error("offline");
      const ref = await addDoc(collection(db,"count_details"), {...data, timestamp: serverTimestamp()});
      const idx = scanEvents.findIndex(e=>e.docId===localId);
      if (idx>-1) scanEvents[idx] = {...scanEvents[idx], docId:ref.id, _pending:false};
    } catch (err) {
      await queuePut({ id:localId, type:"add_detail", data, ts:Date.now() });
    }
    updateOfflineBadge();
  }
  async function syncJobProgress() {
    const st = checklistStats();
    const fields = { matched_count: st.matched, over_count: st.over, expected_target: st.total };
    try {
      if (!navigator.onLine) throw new Error("offline");
      await updateDoc(doc(db,"count_jobs",curJob.id), fields);
    } catch (err) {
      // ใช้ id คงที่ต่อ job (progress_<jobId>) — เขียนทับกันเอง ไม่สะสม queue บวมจากการสแกนรัวๆ
      await queuePut({ id:"progress_"+curJob.id, type:"update_progress", data:{jobId:curJob.id, fields}, ts:Date.now() });
    }
  }
  function updateProgress() {
    const st = checklistStats();
    document.getElementById("ring-n").textContent = st.matched;
    document.getElementById("ring-e").textContent = st.total||"?";
    const pct = st.total>0 ? Math.min(st.matched/st.total,1) : 0;
    const ring = document.getElementById("ring-dash");
    ring.style.strokeDashoffset = CIRC - pct*CIRC;
    ring.style.stroke = st.over>0 ? "#dc2626" : pct>=1 ? "#16a34a" : pct>=0.5 ? "#f59e0b" : "#6366f1";
    document.getElementById("over-hint").style.display = st.over>0 ? "block" : "none";
    document.getElementById("over-count").textContent = st.over;
  }

  async function handleScan(raw) {
    if (!curJob) return;
    const tag = extractLocFromScan(raw).trim().toUpperCase();
    if (!tag) return;
    const now = Date.now();
    if (now - lastScan < 350) return;
    lastScan = now;
    document.getElementById("tag-input").value="";
    const isMasterRow = masterRows().some(r=>r.tag_barcode===tag);
    if (isBulkZone(curJob.zone)) {
      if (isMasterRow && countFor(tag)>=1) {
        toast("✅ อันนี้ติ๊กไปแล้ว");
        document.getElementById("tag-input").focus();
        return;
      }
      await commitScan(tag);
      await syncJobProgress();
    } else if (isMasterRow) {
      // โซน Normal: ยิงซ้ำ = นับจำนวนเพิ่มทีละ 1 (พิมพ์เลขตรงๆ ก็ได้ในช่อง qty ของรายการนั้น)
      await setQtyForTag(tag, (qtyByTag[tag]||0) + 1);
      await syncJobProgress();
    } else {
      await commitScan(tag); // ของเกิน/นอกรายการ — ยังใช้ระบบ event เดิม
      await syncJobProgress();
    }
    renderChecklist(); updateProgress();
    document.getElementById("tag-input").focus();
    if (navigator.vibrate) navigator.vibrate(60);
  }
  document.getElementById("tag-input").addEventListener("keydown", e => {
    if (e.key==="Enter") { e.preventDefault(); const v=e.target.value.trim(); if(v) handleScan(v); }
  });

  // qrbox กว้าง-เตี้ย เหมาะกับบาร์โค้ด 1D (บาร์โค้ดจริงมักเป็นแนวนอน ไม่ใช่สี่เหลี่ยมจัตุรัสแบบ QR)
  // และระบุ format ที่ใช้จริงชัดเจน แทนที่จะให้ library เดาทุก format (แม่นและไวขึ้น)
  const BARCODE_CAM_CONFIG = {
    fps: 15,
    qrbox: { width: 260, height: 90 },
    formatsToSupport: [
      Html5QrcodeSupportedFormats.QR_CODE,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.ITF,
    ]
  };

  // ── กล้องสแกนแบบ fullscreen overlay ใช้ร่วมกันทั้ง 3 จุด (Tag / เลือก Location / Location ถัดไป) ──
  // แก้ปัญหาหน้าจอขยับ/เลื่อนหาปุ่มไม่เจอตอนเปิดกล้อง เพราะเป็น overlay ไม่ใช่ inline ที่ดันของข้างล่างลง

  async function openCam(onDecode, autoClose) {
    // เช็คก่อนว่าเบราว์เซอร์/แอปนี้รองรับกล้องไหม (webview ในแอป LINE/Facebook/Instagram
    // มักบล็อกกล้องไว้ ไม่ว่าโค้ดจะเขียนดีแค่ไหนก็เปิดไม่ได้ — ต้องเปิดด้วย Safari/Chrome จริงๆ)
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast("📷 เบราว์เซอร์นี้ไม่รองรับกล้อง (ถ้าเปิดจากแอป LINE/Facebook ให้เปิดด้วย Safari/Chrome แทน) — ใช้ช่องพิมพ์บาร์โค้ดด้านบนได้เลย", "err", 5000);
      return;
    }
    const modal = document.getElementById("cam-modal");
    modal.style.display = "flex";
    html5Cam = new Html5Qrcode("cam-reader");
    const onFrame = text => { onDecode(text); if (autoClose) closeCam(); };
    // เรียกกล้องทันทีจากการกดของ user โดยตรง ไม่หน่วงเวลาก่อน — iOS Safari ต้องการให้ขอสิทธิ์กล้อง
    // ต่อเนื่องจากการกดของ user จริงๆ (user gesture) ถ้าหน่วงหลายจังหวะก่อนอาจถูกปฏิเสธเงียบๆ
    // ปัญหาจอดำแก้ด้วย min-height ที่ตั้งไว้ใน CSS ของ #cam-reader แทน ไม่ต้องหน่วงเวลารอ layout
    try {
      await html5Cam.start({ facingMode: "environment" }, BARCODE_CAM_CONFIG, onFrame, ()=>{});
      camStarted = true;
    } catch (err1) {
      // บางยี่ห้อ/บางเครื่องไม่รู้จัก facingMode "environment" — ลองเปิดกล้องแบบไม่ระบุ (เอาตัวไหนก็ได้ที่มี)
      try {
        await html5Cam.start({}, BARCODE_CAM_CONFIG, onFrame, ()=>{});
        camStarted = true;
      } catch (err2) {
        modal.style.display = "none";
        const err = err2;
        const msg = (err?.name === "NotAllowedError") ? "ไม่ได้รับสิทธิ์กล้อง — เข้า Settings เบราว์เซอร์แล้วอนุญาตกล้องให้เว็บนี้"
          : (err?.name === "NotFoundError") ? "ไม่พบกล้องในเครื่องนี้"
          : "เปิดกล้องไม่ได้ (" + (err?.message||err) + ") — ใช้ช่องพิมพ์บาร์โค้ดแทนได้เลย";
        toast("📷 "+msg, "err", 5000);
      }
    }
  }
  async function closeCam() {
    await stopCam();
    document.getElementById("cam-modal").style.display = "none";
  }
  async function stopCam() {
    if (html5Cam && camStarted) { await html5Cam.stop().catch(()=>{}); html5Cam=null; camStarted=false; }
  }

  document.getElementById("btn-toggle-cam").addEventListener("click", () => {
    openCam(text => handleScan(text), false);
  });
  document.getElementById("btn-stop-cam").addEventListener("click", closeCam);

  // ── แจ้งของเกิน: modal พร้อมสาเหตุ + รูปแนบ (ไม่บังคับ) ────
  let overModalPhotoFile = null;
  document.getElementById("btn-report-over").addEventListener("click", () => {
    document.getElementById("over-modal-tag").value = "";
    document.getElementById("over-modal-reason").value = "";
    document.getElementById("over-modal-photo").value = "";
    document.getElementById("over-modal-photo-preview").style.display = "none";
    overModalPhotoFile = null;
    document.getElementById("over-modal").style.display = "flex";
    setTimeout(()=>document.getElementById("over-modal-tag").focus(), 50);
  });
  document.getElementById("over-modal-cancel").addEventListener("click", () => {
    document.getElementById("over-modal").style.display = "none";
  });
  document.getElementById("over-modal-photo").addEventListener("change", e => {
    const f = e.target.files[0];
    overModalPhotoFile = f || null;
    const prev = document.getElementById("over-modal-photo-preview");
    if (f) {
      const url = URL.createObjectURL(f);
      prev.querySelector("img").src = url;
      prev.style.display = "block";
    } else prev.style.display = "none";
  });
  document.getElementById("over-modal-confirm").addEventListener("click", async () => {
    const tag = document.getElementById("over-modal-tag").value.trim().toUpperCase();
    if (!tag) { toast("⚠️ ระบุรหัสของที่เกินก่อน"); return; }
    if (masterRows().some(r=>r.tag_barcode===tag)) { toast("อันนี้อยู่ในรายการอยู่แล้ว สแกนช่องปกติได้เลย","err"); return; }
    const reason = document.getElementById("over-modal-reason").value || "";
    const btn = document.getElementById("over-modal-confirm");
    const orig = btn.textContent;
    btn.disabled = true; btn.textContent = "⏳ กำลังบันทึก...";
    let photoUrl = "", photoWarning = false;
    if (overModalPhotoFile) {
      try {
        if (!navigator.onLine) throw new Error("offline");
        btn.textContent = "⏳ กำลังอัปโหลดรูป...";
        const path = `stocktake_evidence/${curJob.id}/${Date.now()}_${overModalPhotoFile.name}`;
        const sref = storageRef(storage, path);
        await uploadBytes(sref, overModalPhotoFile);
        photoUrl = await getDownloadURL(sref);
      } catch (err) {
        photoWarning = true; // ไม่บล็อกการบันทึก แค่ไม่มีรูปแนบ (เช่น ตอนนี้ออฟไลน์ อัปโหลดรูปไม่ได้)
      }
    }
    await commitScan(tag, { reason, photo_url: photoUrl, is_over: true });
    await syncJobProgress(); renderChecklist(); updateProgress(); updateOfflineBadge();
    document.getElementById("over-modal").style.display = "none";
    toast(photoWarning ? `🔺 บันทึกของเกินแล้ว (รูปแนบไม่ได้ตอนนี้ — ลองแนบใหม่ทีหลัง)` : `🔺 บันทึกของเกินแล้ว`, "ok", 3500);
    btn.disabled = false; btn.textContent = orig;
  });

  // ── กดผิด Location: แจ้ง Admin แทนการลบเอง (กันพนักงานลบ/ปิดบังของจริงได้) ──
  document.getElementById("btn-wrong-location").addEventListener("click", async () => {
    if (!curJob) return;
    if (!confirm(`ยืนยันว่ากดผิด Location "${curJob.location}"?\n\nจะแจ้ง Admin ให้ตรวจสอบและรีเซ็ตให้ แล้วพาคุณกลับไปเลือก Location ใหม่`)) return;
    try {
      await updateDoc(doc(db,"count_jobs",curJob.id), {
        wrong_location_flag: true, flagged_at: serverTimestamp(), flagged_by: curJob.createdName
      });
    } catch (err) {
      // ถ้าออฟไลน์ ก็ยังปล่อยให้กลับไปเลือกใหม่ได้ปกติ ไม่บล็อกงาน — แค่ admin จะเห็น flag ช้าหน่อย
    }
    await stopCam();
    document.getElementById("screen-scan").style.display = "none";
    document.getElementById("screen-start").style.display = "block";
    document.getElementById("loc-select-card").style.display = "none";
    document.getElementById("area-select").value = "";
    selLoc = ""; curJob = null; scanEvents = []; qtyByTag = {};
    toast("✅ แจ้ง Admin แล้ว — เลือก Location ใหม่ได้เลย", "ok");
    setTimeout(()=>document.getElementById("loc-barcode-input")?.focus(), 100);
  });

  document.getElementById("btn-finish-job").addEventListener("click", async () => {
    if (!curJob) return;
    const st = checklistStats();
    const shortNow = Math.max(0, st.total - st.matched - st.over);
    if (st.over>0 || shortNow>0) {
      const ok = confirm(`ตรง ${st.matched}/${st.total}${shortNow>0?` · ขาด ${shortNow}`:""}${st.over>0?` · เกิน ${st.over}`:""}\n\nยืนยันปิดโลนี้?`);
      if (!ok) return;
    }
    const fields = {
      count_status:"Completed",
      matched_count: st.matched, expected_target: st.total, short_count: shortNow, over_count: st.over
    };
    let queuedOffline = false;
    try {
      if (!navigator.onLine) throw new Error("offline");
      await updateDoc(doc(db,"count_jobs",curJob.id), {...fields, end_time: serverTimestamp()});
    } catch (err) {
      // "__SERVER_TIMESTAMP__" คือ marker ข้อความล้วน (เก็บใน IndexedDB ได้จริง)
      // จะถูกแปลงเป็น serverTimestamp() จริงตอน flushQueue() sync กลับออนไลน์
      await queuePut({ id:"finish_"+curJob.id, type:"finish_job", data:{jobId:curJob.id, fields:{...fields, end_time:"__SERVER_TIMESTAMP__"}}, ts:Date.now() });
      queuedOffline = true;
    }
    await stopCam();
    document.getElementById("screen-scan").style.display="none";
    document.getElementById("screen-done").style.display="block";
    document.getElementById("done-icon").textContent = (shortNow+st.over)>0 ? "⚠️" : "🎉";
    document.getElementById("done-detail").textContent = `${curJob.location} — ตรง ${st.matched}/${st.total}${shortNow>0?` · ขาด ${shortNow}`:""}${st.over>0?` · เกิน ${st.over}`:""}${queuedOffline?" (รอ sync)":""}`;
    const encourageEl = document.getElementById("done-encourage");
    if (encourageEl) {
      encourageEl.textContent = (shortNow+st.over)===0 ? "เยี่ยมมาก! นับตรงเป๊ะ ขอบคุณสำหรับความละเอียดครับ/ค่ะ 👏" : "ขอบคุณที่นับให้ครับ/ค่ะ มีของไม่ตรงนิดหน่อย เดี๋ยวหัวหน้างานจะตรวจสอบต่อเอง 🙏";
    }
    updateOfflineBadge();
  });
</script>
</body>
</html>

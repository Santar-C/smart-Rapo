<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAPO System</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#021D49">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & Base ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue:    #021D49;
      --red:     #E1261C;
      --indigo:  #6366f1;
      --green:   #16a34a;
      --amber:   #d97706;
      --teal:    #0d9488;
      --gray:    #6b7280;
      --light:   #f8fafc;
      --white:   #ffffff;
      --border:  #e2e8f0;
      --shadow:  0 4px 24px rgba(0,0,0,0.08);
      --radius:  14px;
    }
    body {
      font-family: 'Sarabun', sans-serif;
      background: var(--light);
      color: #1e293b;
      min-height: 100dvh;
    }

    /* ── LOGIN PAGE ──────────────────────────────── */
    #login-page {
      position: relative;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #021D49;
      padding: 1.5rem;
      isolation: isolate;
      overflow: hidden;
    }
    #login-page::before {
      content: '';
      position: absolute; inset: 0;
      background-image: url('assets/%E0%B8%AA%E0%B8%B7%E0%B9%88%E0%B8%AD.jpg');
      background-size: cover;
      background-position: center;
      filter: brightness(.55) contrast(1.14) saturate(.7);
      z-index: -2;
    }
    #login-page::after {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.55) 100%),
        linear-gradient(160deg, rgba(2,29,73,.55) 0%, rgba(2,10,30,.15) 45%, rgba(2,29,73,.6) 100%);
      z-index: -1;
    }

    /* ── Brand dock (floating proximity-magnify nav bar) ──
       Ported from the ThreeUI liquid-glass dock pattern: pills grow and lift
       as the pointer nears them, with a specular rim that tracks the pointer
       angle. Re-tuned to RAPO's navy palette; the physics are a lighter
       CSS-transition version of the original spring integrator (same visual
       result, far less code to keep correct). */
    .rapo-dock-wrap {
      position: absolute;
      top: 1.75rem;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 5;
    }
    .rapo-dock {
      position: relative;
      isolation: isolate;
      pointer-events: auto;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      height: 48px;
      padding: 5px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.14);
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0) 42%), rgba(2,20,50,.55);
      box-shadow: 0 8px 22px rgba(2,10,30,.35), inset 0 1px rgba(255,255,255,.08);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      --spec-angle: 2.4rad;
      --spec-bright: 0;
    }
    .rapo-dock::after {
      content: '';
      position: absolute;
      inset: -1px;
      z-index: 5;
      padding: 1px;
      border-radius: inherit;
      pointer-events: none;
      opacity: var(--spec-bright);
      background: conic-gradient(from var(--spec-angle) at 50% 50%,
        rgba(255,255,255,0) 0deg, rgba(255,255,255,.10) 14deg, rgba(255,255,255,.95) 28deg,
        rgba(255,255,255,.18) 46deg, rgba(255,255,255,0) 68deg, rgba(255,255,255,0) 180deg,
        rgba(255,255,255,.10) 194deg, rgba(255,255,255,.95) 208deg, rgba(255,255,255,.18) 226deg,
        rgba(255,255,255,0) 248deg, rgba(255,255,255,0) 360deg);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
    }
    .rapo-dock-item {
      position: relative;
      z-index: 6;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
      height: 38px;
      padding: 0 14px;
      border-radius: 11px;
      border: 1px solid transparent;
      background: rgba(255,255,255,.045);
      color: rgba(255,255,255,.74);
      font-size: .74rem;
      font-weight: 600;
      letter-spacing: .015em;
      white-space: nowrap;
      transform-origin: 50% 0;
      will-change: transform;
    }
    .rapo-dock-item[data-near="true"] {
      z-index: 7;
      color: #fff;
      border-color: rgba(255,255,255,.22);
      background: rgba(4,28,66,.94);
      box-shadow: 0 7px 16px rgba(2,10,30,.35);
    }
    .rapo-dock-mark {
      width: 38px;
      padding: 0;
      overflow: hidden;
      background: #fff;
      border-color: #fff;
      color: var(--blue);
      font-weight: 800;
    }
    .rapo-dock-mark img { width: 60%; height: 60%; object-fit: contain; display: block; }
    .rapo-dock-mark[data-near="true"] { background: #fff; border-color: #fff; }
    @media (max-width: 640px) {
      .rapo-dock-word:last-child { display: none; }
    }

    .login-card {
      background: var(--white);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .login-logo img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 16px;
    }
    .login-logo .logo-fallback {
      width: 90px;
      height: 90px;
      background: var(--blue);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      font-size: 2rem;
      font-weight: 700;
      color: white;
    }
    .login-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--blue);
      margin-bottom: 0.25rem;
    }
    .login-subtitle {
      text-align: center;
      font-size: 0.875rem;
      color: var(--gray);
      margin-bottom: 1.75rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.4rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      font-family: 'Sarabun', sans-serif;
      transition: border-color 0.2s;
      outline: none;
      background: #f8fafc;
    }
    .form-group input:focus {
      border-color: var(--indigo);
      background: white;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    /* ── Liquid-metal login button ──
       Ported from the ThreeUI liquid-metal control: a WebGL2 dispersion
       shader (metal field + travelling rim + press ripple + bloom) that
       renders behind a real <button>, so it stays keyboard/click accessible.
       Re-plated in RAPO navy instead of the source's neutral dark plate —
       the metal's own coloring comes from spectral dispersion, not a
       hardcoded hue, so it already reads as chrome/steel with no change. */
    .liquid-stage {
      --lu: calc(var(--h) / 516);
      --bh: var(--h);
      --pad: calc(900 * var(--lu));
      position: relative;
      width: max-content;
      height: max-content;
      padding: var(--pad);
      margin: 0.5rem auto 0;
      display: grid;
      place-items: center;
      touch-action: manipulation;
    }
    .login-liquid-stage { --h: 54px; }
    .liquid-plate {
      position: absolute;
      inset: var(--pad);
      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.015) 44%, rgba(255,255,255,0) 64%),
        rgba(2,20,50,.55);
      box-shadow:
        0 calc(var(--h) * 0.08) calc(var(--h) * 0.18) rgba(2,10,30,.42),
        0 calc(var(--h) * 0.24) calc(var(--h) * 0.50) rgba(2,10,30,.30),
        0 calc(var(--h) * 0.48) calc(var(--h) * 0.96) rgba(2,10,30,.18),
        inset 0 1px 0 rgba(255,255,255,.14),
        inset 0 calc(var(--h) * -0.02) calc(var(--h) * 0.05) rgba(255,255,255,.05);
      transition: box-shadow .38s cubic-bezier(.22,.61,.36,1), background .38s cubic-bezier(.22,.61,.36,1);
    }
    .liquid-stage.hot .liquid-plate {
      background:
        linear-gradient(180deg, rgba(255,255,255,.11), rgba(255,255,255,.02) 44%, rgba(255,255,255,0) 64%),
        rgba(2,16,42,.62);
      box-shadow:
        0 calc(var(--h) * 0.10) calc(var(--h) * 0.22) rgba(2,10,30,.48),
        0 calc(var(--h) * 0.32) calc(var(--h) * 0.66) rgba(2,10,30,.36),
        0 calc(var(--h) * 0.66) calc(var(--h) * 1.32) rgba(2,10,30,.22),
        inset 0 1px 0 rgba(255,255,255,.18),
        inset 0 calc(var(--h) * -0.02) calc(var(--h) * 0.05) rgba(255,255,255,.06);
    }
    .liquid-stage.press .liquid-plate {
      background:
        linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.01) 44%, rgba(255,255,255,0) 64%),
        rgba(1,14,38,.68);
      box-shadow:
        0 calc(var(--h) * 0.04) calc(var(--h) * 0.11) rgba(2,10,30,.5),
        0 calc(var(--h) * 0.13) calc(var(--h) * 0.32) rgba(2,10,30,.38),
        0 calc(var(--h) * 0.27) calc(var(--h) * 0.62) rgba(2,10,30,.24),
        inset 0 1px 0 rgba(255,255,255,.10);
      transition-duration: .10s;
    }
    .liquid-fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .btn-login {
      position: relative;
      height: var(--bh);
      padding: 0 2.4rem;
      border: 0;
      background: none;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Sarabun', sans-serif;
      line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    .btn-login:focus-visible { outline: calc(4 * var(--lu)) solid rgba(255,255,255,.55); outline-offset: calc(10 * var(--lu)); }
    .btn-login .lbl { display: block; transform: translateY(calc(2 * var(--lu))); white-space: nowrap; }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
    .login-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: none;
    }
    .login-footer {
      text-align: center;
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 1.5rem;
    }

    /* ── DASHBOARD PAGE ──────────────────────────── */
    #dashboard-page { display: none; }
    #dashboard-page {
      min-height: 100dvh;
      position: relative;
      background: #021D49;
    }
    #dashboard-page::before {
      content: '';
      position: absolute; inset: 0;
      min-height: 100dvh;
      background-image: url('assets/%E0%B8%AA%E0%B8%B7%E0%B9%88%E0%B8%AD.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      filter: brightness(.5) contrast(1.12) saturate(.7);
      z-index: 0;
    }
    #dashboard-page::after {
      content: '';
      position: absolute; inset: 0;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.5) 100%),
        linear-gradient(160deg, rgba(2,29,73,.55) 0%, rgba(2,10,30,.15) 45%, rgba(2,29,73,.6) 100%);
      z-index: 0;
    }
    .dash-header, .dash-body { position: relative; z-index: 1; }
    .dash-header {
      background: rgba(2,29,73,.55);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      color: white;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 4px 24px rgba(0,0,0,.25);
    }
    .dash-header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .dash-header-logo {
      width: 40px;
      height: 40px;
      background: white;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--blue);
      font-size: 1rem;
      flex-shrink: 0;
      overflow: hidden;
      padding: 4px;
    }
    .dash-header-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .dash-header-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .dash-header-subtitle {
      font-size: 0.75rem;
      opacity: 0.7;
    }
    .dash-header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }
    .user-badge {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,.18);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .user-badge .role-pill {
      background: var(--indigo);
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .btn-logout {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: 'Sarabun', sans-serif;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.25); }
    .dash-body {
      padding: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    .dash-greeting {
      margin-bottom: 1.5rem;
    }
    .dash-greeting h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: white;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .dash-greeting h2 svg { color: var(--amber); flex-shrink: 0; }
    .dash-greeting p {
      font-size: 0.9rem;
      color: rgba(255,255,255,.65);
      margin-top: 0.2rem;
    }
    /* Menu Reel (การ์ดเมนูหมุนวนบนวงรี แทน grid เดิม) */
    .menu-halo-wrap {
      position: relative;
      margin: 0 0.25rem;
    }
    .menu-halo-stage {
      position: relative;
      height: 260px;
      touch-action: pan-y;
      outline: none;
      cursor: grab;
      user-select: none;
    }
    .menu-halo-stage:active { cursor: grabbing; }
    .menu-halo-stage:focus-visible {
      box-shadow: 0 0 0 3px rgba(99,102,241,0.35);
      border-radius: 20px;
    }
    .menu-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      line-height: 1;
      color: white;
      cursor: pointer;
      z-index: 1200;
      transition: background .2s;
    }
    .menu-nav-btn:hover { background: rgba(255,255,255,.22); }
    .menu-nav-prev { left: -6px; }
    .menu-nav-next { right: -6px; }
    .menu-card {
      position: absolute;
      left: 50%;
      top: 50%;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: var(--radius);
      padding: 1.25rem 0.85rem;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.5);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: box-shadow 0.25s, border-color 0.25s;
      cursor: pointer;
      overflow: hidden;
      will-change: transform, opacity;
    }
    .menu-card::before {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: var(--card-color, var(--border));
      border-radius: 0 0 var(--radius) var(--radius);
    }
    .menu-card:hover {
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
      border-color: transparent;
    }
    .menu-card .card-icon { display: flex; color: var(--card-color, var(--blue)); }
    .menu-card .card-icon svg { width: 34px; height: 34px; }
    .menu-card .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--blue);
      text-align: center;
      line-height: 1.3;
    }
    .menu-card .card-sub {
      font-size: 0.75rem;
      color: var(--gray);
      text-align: center;
    }
    /* Card color accents */
    .card-medicine  { --card-color: #ec4899; }
    .card-stock     { --card-color: var(--green); }
    .card-stocktake { --card-color: var(--amber); }
    .card-monitor   { --card-color: var(--gray); }
    .card-dashboard { --card-color: var(--indigo); }
    .card-dock      { --card-color: var(--indigo); }
    .card-wi        { --card-color: #94a3b8; }
    .card-wms       { --card-color: #0891b2; }
    .card-users     { --card-color: #f59e0b; }

    /* Admin-only badge */
    .admin-badge {
      position: absolute;
      top: 10px; right: 10px;
      background: #fef3c7;
      color: #92400e;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid #fde68a;
    }

    /* ── LOADING OVERLAY ─────────────────────────── */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      flex-direction: column;
      gap: 1rem;
    }
    #loading-overlay .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loading-overlay p { color: rgba(255,255,255,0.8); font-size: 0.9rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── RESPONSIVE ──────────────────────────────── */
    @media (max-width: 480px) {
      .menu-halo-stage { height: 230px; }
      .dash-body { padding: 1rem; }
      .user-badge span.name { display: none; }
    }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <p>กำลังโหลดระบบ...</p>
  </div>

  <!-- ── LOGIN PAGE ──────────────────────────────── -->
  <div id="login-page">
    <div class="rapo-dock-wrap">
      <div class="rapo-dock" id="rapo-dock" role="presentation">
        <div class="rapo-dock-item rapo-dock-mark" aria-hidden="true">
          <img src="assets/logo.png" alt=""
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
          <span style="display:none;align-items:center;justify-content:center;width:100%;height:100%">R</span>
        </div>
        <div class="rapo-dock-item rapo-dock-word">RAPO System</div>
        <div class="rapo-dock-item rapo-dock-word">Stock · Medicine · Smart Dock</div>
      </div>
    </div>
    <div class="login-card">
      <div class="login-logo">
        <img src="assets/logo.png" alt="RAPO Logo"
             onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex'">
        <div id="logo-fallback" class="logo-fallback" style="display:none">R</div>
      </div>
      <h1 class="login-title">RAPO System</h1>
      <p class="login-subtitle">Stock · Medicine · Smart Dock</p>

      <div class="login-error" id="login-error"></div>

      <div class="form-group">
        <label for="email">อีเมล</label>
        <input type="email" id="email" placeholder="admin@rapo.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div class="liquid-stage login-liquid-stage" id="login-liquid" data-liquid-metal="explore">
        <div class="liquid-plate plate" aria-hidden="true"></div>
        <canvas class="liquid-fx" aria-hidden="true"></canvas>
        <button class="btn-login" id="btn-login" type="button"><span class="lbl" id="btn-login-label">เข้าสู่ระบบ</span></button>
      </div>

    // ── Render เมนู (การ์ดหมุนวนบนวงรี) ───────────
    function renderCards(role) {
      const stage = document.getElementById("menu-halo-stage");
      if (!stage) return;
      stage.innerHTML = "";

      const items = MENUS.filter(menu => menu.role !== "admin" || role === "admin");
      if (!items.length) return;

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const CARD_W = 168, CARD_H = 190, MIN_SCALE = 0.72, MAX_VISIBLE = 3;
      const count = items.length;

      const cards = items.map(menu => {
        const el = document.createElement("div");
        el.className = `menu-card ${menu.color}`;
        el.style.width  = CARD_W + "px";
        el.style.height = CARD_H + "px";
        el.innerHTML = `
          ${menu.role === "admin" ? '<span class="admin-badge">Admin</span>' : ""}
          <span class="card-icon">${icon(menu.icon, { size: 34 })}</span>
          <span class="card-title">${menu.title}</span>
          ${menu.sub ? `<span class="card-sub">${menu.sub}</span>` : ""}
        `;
        stage.appendChild(el);
        return { el, href: menu.href };
      });

      // coverflow แนวนอนล้วน (ไม่มีแกน y) — ระยะห่างระหว่างการ์ดคงที่กว่าครึ่งความกว้าง
      // การ์ดเสมอ จึงไม่มีทางที่การ์ดสองใบจะทับกันจนอ่านตัวหนังสือไม่ออกแบบวงรีเต็มที่ลอง
      // มาก่อน (เหมาะกับของตกแต่งหน้า login แต่ไม่เหมาะกับเมนูที่ต้องคลิกจริง)
      let gap = 0;
      function measure() {
        gap = Math.max(CARD_W * 0.62, Math.min(stage.offsetWidth / 4.2, CARD_W * 0.95));
      }

      let position = 0; // หน่วยเป็น "ช่อง" (slot), ไม่ใช่ radian
      function wrapDelta(d) {
        // ระยะที่ใกล้ 0 ที่สุดของ d เมื่อวนรอบ count ช่อง → ได้ ring ที่หมุนวนไม่รู้จบ
        let x = ((d % count) + count) % count;
        if (x > count / 2) x -= count;
        return x;
      }

      function render() {
        cards.forEach((c, i) => {
          const d = wrapDelta(i - position);
          const ad = Math.abs(d);
          const scale = Math.max(MIN_SCALE, 1 - ad * 0.16);
          const visible = ad <= MAX_VISIBLE;
          c.el.style.transform = `translate(-50%,-50%) translate(${d * gap}px, 0px) scale(${scale})`;
          c.el.style.zIndex  = Math.round((10 - ad) * 100);
          c.el.style.opacity = visible ? Math.max(0.25, 1 - ad * 0.3) : 0;
          c.el.style.pointerEvents = visible ? "auto" : "none";
        });
      }

      let raf = 0;
      function animateTo(target, duration, onDone) {
        const start = position, delta = target - start, t0 = performance.now();
        cancelAnimationFrame(raf);
        (function tick(now) {
          const p = Math.min(1, (now - t0) / duration);
          position = start + delta * (1 - Math.pow(1 - p, 3)); // ease-out cubic
          render();
          if (p < 1) raf = requestAnimationFrame(tick);
          else if (onDone) onDone();
        })(t0);
      }

      let dragging = false, hovering = false, holdTimer = 0;
      let dragStartX = 0, dragStartPos = 0, pointerDownPos = null, moved = false, pressedCard = null;

      function scheduleAutoplay() {
        if (reduceMotion) return;
        clearTimeout(holdTimer);
        holdTimer = setTimeout(() => {
          if (dragging || hovering) { scheduleAutoplay(); return; }
          animateTo(Math.round(position) + 1, 700, scheduleAutoplay);
        }, 2200);
      }

      stage.addEventListener("pointerenter", () => { hovering = true; });
      stage.addEventListener("pointerleave", () => { hovering = false; });

      stage.addEventListener("pointerdown", e => {
        dragging = true;
        moved = false;
        // จำการ์ดที่กดไว้ตอนนี้ ก่อนเรียก setPointerCapture — เพราะหลัง capture
        // ทั้ง pointerup/mouseup/click ที่ตามมาจะถูก retarget ไปที่ stage หมด
        // (ไม่ใช่การ์ดที่นิ้ว/เมาส์อยู่จริง) ทำให้ click listener บนตัวการ์ดไม่ทำงาน
        pressedCard = e.target.closest(".menu-card");
        pointerDownPos = { x: e.clientX, y: e.clientY };
        dragStartX = e.clientX;
        dragStartPos = position;
        stage.setPointerCapture(e.pointerId);
        cancelAnimationFrame(raf);
        clearTimeout(holdTimer);
      });
      stage.addEventListener("pointermove", e => {
        if (!dragging) return;
        if (pointerDownPos) {
          const dx = e.clientX - pointerDownPos.x, dy = e.clientY - pointerDownPos.y;
          if (Math.hypot(dx, dy) > 6) moved = true;
        }
        position = dragStartPos - (e.clientX - dragStartX) / gap;
        render();
      });
      function endDrag() {
        if (!dragging) return;
        dragging = false;
        if (!moved && pressedCard) {
          const clicked = cards.find(c => c.el === pressedCard);
          if (clicked) { window.location.href = clicked.href; return; }
        }
        animateTo(Math.round(position), 350, scheduleAutoplay);
      }
      stage.addEventListener("pointerup", endDrag);
      stage.addEventListener("pointercancel", endDrag);

      function spinBy(direction) {
        clearTimeout(holdTimer);
        cancelAnimationFrame(raf);
        animateTo(Math.round(position) + direction, 400, scheduleAutoplay);
      }
      document.getElementById("menu-prev").onclick = () => spinBy(-1);
      document.getElementById("menu-next").onclick = () => spinBy(1);

      stage.onkeydown = e => {
        if (e.key === "ArrowRight") { e.preventDefault(); spinBy(1); }
        else if (e.key === "ArrowLeft") { e.preventDefault(); spinBy(-1); }
        else if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          const frontIdx = ((Math.round(position) % count) + count) % count;
          window.location.href = cards[frontIdx].href;
        }
      };

      measure();
      render();
      scheduleAutoplay();
      window.addEventListener("resize", () => { measure(); render(); });
    }

    // ── Login Button ──────────────────────────────

    async function doLogin() {
      const email    = document.getElementById("email").value.trim();

        showError("กรุณากรอกอีเมลและรหัสผ่าน");

      const result = await loginUser(email, password);
      if (!result.ok) {
        showError(result.error);
        btnLogin.disabled = false;
        btnLoginLabel.textContent = "เข้าสู่ระบบ";
      }
      // ถ้าสำเร็จ onAuthStateChanged จะ handle เอง
    }

    function showError(msg) {
      errBox.textContent = msg;
      errBox.style.display = "block";

    btnLogin.addEventListener("click", doLogin);
    document.getElementById("password").addEventListener("keydown", e => {

    // ── Logout Button ─────────────────────────────
    document.getElementById("btn-logout").addEventListener("click", logoutUser);

    // ── Brand dock (proximity-magnify nav bar) ────
    // Lighter re-implementation of the ThreeUI liquid-glass dock: CSS
    // transitions drive the magnify/lift instead of a hand-rolled spring
    // integrator, which keeps the same visual result with far less code.
    initDock();
    function initDock() {
      const dock = document.getElementById("rapo-dock");
      if (!dock) return;
      const items = Array.from(dock.querySelectorAll(".rapo-dock-item"));
      const fine = window.matchMedia("(hover:hover) and (pointer:fine)").matches;
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!fine || reduceMotion) return;

      items.forEach(el => {
        el.style.transition = "transform .2s cubic-bezier(.22,.61,.36,1), background .2s, border-color .2s";
      });

      function reset() {
        items.forEach(el => { el.style.transform = ""; el.dataset.near = "false"; });
        dock.style.setProperty("--spec-bright", "0");
      }

      window.addEventListener("pointermove", e => {
        const rect = dock.getBoundingClientRect();
        const within = e.clientX > rect.left - 60 && e.clientX < rect.right + 60 &&
                        e.clientY > rect.top - 40 && e.clientY < rect.bottom + 90;
        if (!within) { reset(); return; }

        items.forEach(el => {
          const r = el.getBoundingClientRect();
          const cx = r.left + r.width / 2;
          const prox = Math.max(0, 1 - Math.abs(e.clientX - cx) / 130);
          const eased = prox * prox * (3 - 2 * prox);
          el.style.transform = `translateY(${(-3.5 * eased).toFixed(2)}px) scale(${(1 + 0.14 * eased).toFixed(3)})`;
          el.dataset.near = eased > 0.1 ? "true" : "false";
        });

        const dcx = rect.left + rect.width / 2, dcy = rect.top + rect.height / 2;
        const angle = Math.atan2(dcy - e.clientY, e.clientX - dcx);
        const dist = Math.hypot(e.clientX - dcx, e.clientY - dcy);
        dock.style.setProperty("--spec-angle", angle.toFixed(3) + "rad");
        dock.style.setProperty("--spec-bright", (Math.max(0, 1 - dist / 260) * 0.85).toFixed(3));
      }, { passive: true });

      window.addEventListener("pointerleave", reset);
    }

    // ── Liquid-metal login button ─────────────────
    // Ported near-verbatim from the ThreeUI liquid-metal control: a WebGL2
    // dispersion shader driving a metal field + travelling rim + press
    // ripple + bloom, rendered behind the real <button>. No dependency on
    // three.js or any bundler — matches the rest of this codebase.
    initLiquidMetal();
    function initLiquidMetal() {
      const VERT = `#version 300 es
in vec2 position; void main(){ gl_Position = vec4(position,0.,1.); }`;

      const HEAD = `#version 300 es
precision highp float;
out vec4 o;
uniform vec2  uC; uniform vec2  uHalf; uniform float uT; uniform float uHover; uniform float uPress;
uniform vec4  uRip[3]; uniform vec4  uRipK; uniform vec4  uRipK2;
uniform vec4  uPtr; uniform vec4  uPtrK;
#define PI 3.14159265
float sdPill(vec2 p, vec2 b, float r){
  vec2 q = abs(p) - b + r;
  return min(max(q.x,q.y),0.) + length(max(q,0.)) - r;
}
float ripple(vec2 p, float t){
  float sum = 0.;
  for(int i = 0; i < 3; i++){
    if(uRip[i].w < 0.5) continue;
    float age = t - uRip[i].z;
    if(age < 0. || age > 4.) continue;
    vec2  rp = p - uRip[i].xy;
    float facet = 1. + uRipK2.x * cos(uRipK2.y * atan(rp.y, rp.x) + age * 2.1 + float(i) * 2.4);
    float x = (length(rp) - age * uRipK.x * facet) / uRipK.y;
    sum += exp(-pow(abs(x) + 1e-4, uRipK2.z)) * exp(-age * uRipK.z);
  }
  return sum;
}
float pointerW(vec2 p){
  if(uPtr.z < 0.001) return 0.;
  float d = length(p - uPtr.xy) / uPtrK.x;
  return exp(-d*d) * uPtr.z;
}
vec2 pointerWarp(vec2 p){
  float w = pointerW(p);
  if(w <= 0.) return vec2(0.);
  return normalize(p - uPtr.xy + vec2(1e-5)) * w * (uPtrK.y + uPtrK.z * uPtr.w);
}
`;

      const FRAG_RIM = HEAD + `
uniform float uBw;
uniform float uE[8];
float perim(vec2 d, float a, float r){
  float P = 4.*a + 2.*PI*r;
  float s;
  if(d.x >= a){
    float th = atan(d.y, d.x - a); if(th < 0.) th += 2.*PI;
    s = (th <= PI*0.5) ? r*th : P - r*(2.*PI - th);
  } else if(d.x <= -a){
    float th = atan(d.y, d.x + a); if(th < 0.) th += 2.*PI;
    s = r*PI*0.5 + 2.*a + r*(th - PI*0.5);
  } else if(d.y >= 0.){
    s = r*PI*0.5 + (a - d.x);
  } else {
    s = r*PI*1.5 + 2.*a + (d.x + a);
  }
  return s / P;
}
float pb(float u, float w){ u = fract(u); float x = min(u, 1.-u); return exp(-(x*x)/(w*w)); }
float rimHot(float s, float t){
  float v = uE[0];
  v += 0.62 * pb(s - t*uE[4],             0.075);
  v += 0.44 * pb(s + t*uE[4]*0.63 + 0.41, 0.135);
  v += 0.30 * pb(s - t*uE[4]*0.34 + 0.73, 0.200);
  return v;
}
float rimBand(float sd, float off){ return 1. - smoothstep(0., uBw*1.05, abs(sd + uBw*0.55 + off)); }
void main(){
  vec2  d  = gl_FragCoord.xy - uC;
  float sd = sdPill(d, uHalf, uHalf.y);
  if(sd > uBw*2.5 || sd < -uBw*3.5){ o = vec4(0.); return; }
  float a = max(uHalf.x - uHalf.y, 0.);
  float s = perim(d, a, uHalf.y);
  float top = mix(1., 0.5 + 0.5 * (d.y / uHalf.y), uE[5]);
  vec2  p   = vec2(d.x, -d.y) / (uHalf.y * 2.);
  float lift = 1. + uPress * uE[6] + ripple(p, uT) * uE[7]
             + pointerW(p) * uPtrK.w;
  o = vec4(vec3(
    rimBand(sd,  uE[2]) * rimHot(s + uE[3], uT),
    rimBand(sd,  0.   ) * rimHot(s,         uT),
    rimBand(sd, -uE[2]) * rimHot(s - uE[3], uT)
  ) * uE[1] * top * lift, 1.);
}`;

      const FRAG_SCENE = HEAD + `
uniform float uP[21];
float h21(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float vn(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.-2.*f);
  float a = h21(i), b = h21(i+vec2(1,0)), c = h21(i+vec2(0,1)), d = h21(i+vec2(1,1));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y) * 2. - 1.;
}
float fbm(vec2 p, float g){
  float s = 0., a = 1., n = 0.;
  for(int i=0;i<4;i++){ s += a*vn(p); n += a; p = p*2.03 + 11.7; a *= g; }
  return s / n;
}
float fbm(vec2 p){ return fbm(p, 0.5); }
float wig(float x, float t, float seed){
  return vn(vec2(x,          t*0.150 + seed)) * 0.60
       + vn(vec2(x*2.07 + 4., t*0.105 + seed)) * 0.27
       + vn(vec2(x*4.30 - 7., t*0.080 + seed)) * 0.13;
}
float valleyAt(vec2 p, float t){ return wig(p.x*uP[0], t, 0.0) * uP[1]; }
float densAt  (vec2 p, float t){ return uP[2] * exp(uP[3] * wig(p.x*uP[4] + 9.0, t, 2.7)); }
float surface(vec2 p, float t){
  float V = (p.y - valleyAt(p,t)) * densAt(p,t);
  V += uP[5] * fbm(p*vec2(0.8, 1.7)*uP[6] + vec2(t*0.05, -t*0.03), uP[17]);
  return V - uP[7];
}
float tone(float v){
  float u = fract(v);
  float e = uP[9], W = uP[10] * 0.5;
  return smoothstep(0.5-W-e, 0.5-W, u) * (1. - smoothstep(0.5+W, 0.5+W+e, u));
}
vec3 spec(float t){ return clamp(vec3(1.5) - abs(4.*t - vec3(3.,2.,1.)), 0., 1.); }
void main(){
  vec2  d  = gl_FragCoord.xy - uC;
  float sd = sdPill(d, uHalf, uHalf.y);
  float pill = 1. - smoothstep(-1., 1., sd);
  float S = uHalf.y * 2.;
  float t = uT;
  if(uHover <= 0.0015 || pill <= 0.0015){ o = vec4(0., 0., 0., pill); return; }
  vec2  p = vec2(d.x, -d.y) / S;
  vec2  q = p + pointerWarp(p);
  float h0 = surface(q, t);
  vec2  gp = vec2(dFdx(h0), -dFdy(h0)) * S;
  float V  = surface(q - gp * uP[8] / max(uP[2], .001), t);
  vec2  gd = normalize(gp + vec2(1e-5));
  V += uP[13] * fbm(vec2(dot(q,gd)*uP[14], dot(q, vec2(-gd.y,gd.x))*uP[14]*0.04) + vec2(0., t*0.06));
  float rip  = ripple(p, t);
  float well = pointerW(p);
  V += rip * uRipK.w;
  const int N = 21;
  float mid = 1. - pow(0.5, uP[12]);
  vec3 col = vec3(0.), wsum = vec3(0.);
  for(int i=0;i<N;i++){
    float k = float(i)/float(N-1);
    vec3  w = spec(k);
    col  += w * tone(V + ((1. - pow(1. - k, uP[12])) - mid) * uP[11]);
    wsum += w;
  }
  col /= wsum;
  col = pow(col, vec3(uP[15]));
  float lit = smoothstep(uP[18], uP[19], q.y - valleyAt(q, t));
  lit *= mix(1., lit, 0.55);
  col *= uP[16] * lit;
  col = col * (1. + rip * 1.15 + well * 0.60);
  o = vec4(col * pill * uHover, pill);
}`;

      const FRAG_DOWN = `#version 300 es
precision highp float;
out vec4 o;
uniform sampler2D uTex, uTex2;
uniform vec2 uDstTexel; uniform vec2 uSrcTexel; uniform float uAdd;
void main(){
  vec2 uv = gl_FragCoord.xy * uDstTexel;
  vec2 e = uDstTexel * 0.25;
  vec4 s = texture(uTex, uv + vec2(-e.x,-e.y)) + texture(uTex, uv + vec2( e.x,-e.y))
         + texture(uTex, uv + vec2(-e.x, e.y)) + texture(uTex, uv + vec2( e.x, e.y));
  s *= 0.25;
  if(uAdd > 0.5){
    vec4 r = texture(uTex2, uv + vec2(-e.x,-e.y)) + texture(uTex2, uv + vec2( e.x,-e.y))
           + texture(uTex2, uv + vec2(-e.x, e.y)) + texture(uTex2, uv + vec2( e.x, e.y));
    s.rgb += r.rgb * 0.25;
  }
  o = s;
}`;

      const FRAG_BLUR = `#version 300 es
precision highp float;
out vec4 o;
uniform sampler2D uTex; uniform vec2 uTexel; uniform vec2 uDir; uniform float uR;
void main(){
  vec2 uv = gl_FragCoord.xy * uTexel;
  vec2 st = uTexel * uDir * uR;
  vec4 s = texture(uTex, uv) * 0.1964;
  s += (texture(uTex, uv + st*1.4118) + texture(uTex, uv - st*1.4118)) * 0.2969;
  s += (texture(uTex, uv + st*3.2941) + texture(uTex, uv - st*3.2941)) * 0.0944;
  s += (texture(uTex, uv + st*5.1765) + texture(uTex, uv - st*5.1765)) * 0.0104;
  o = s;
}`;

      const FRAG_COMP = HEAD + `
uniform sampler2D uSoft, uRim, uGlow;
uniform vec2  uRes;
uniform float uGlowGain, uGlowIn, uOccl, uDim, uPunch;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 glow = texture(uGlow, uv).rgb;
  vec2  d    = gl_FragCoord.xy - uC;
  float sd   = sdPill(d, uHalf, uHalf.y);
  float pill = 1. - smoothstep(-1., 1., sd);
  vec4 m = texture(uSoft, uv);
  float veil = 1. - smoothstep(0.46, 0.88, abs(d.y) / uHalf.y);
  vec3 metal = pow(max(m.rgb / max(m.a, 1e-3), 0.), vec3(uPunch));
  vec3 core = metal * pill * mix(1., uDim, veil) + texture(uRim, uv).rgb;
  float rip = ripple(vec2(d.x, -d.y) / (uHalf.y * 2.), uT);
  core += vec3(rip * rip) * uRipK2.w * pill * mix(1., 0.42, veil);
  float sdSh = sdPill(d + vec2(0., uHalf.y * 0.62), uHalf * 0.94, uHalf.y * 0.94);
  float occl = uOccl * exp(-max(sdSh, 0.) / (uHalf.y * 0.75));
  vec3 rgb = core + glow * uGlowGain * mix(1., uGlowIn, pill) * (1. - occl * (1. - pill));
  float a = clamp(max(rgb.r, max(rgb.g, rgb.b)), 0., 1.);
  o = vec4(min(rgb, vec3(1.)), a);
}`;

      function mountLiquidMetal(host) {
        const gl = (host.querySelector(".liquid-fx")).getContext("webgl2", {
          alpha: true, antialias: false, premultipliedAlpha: true, powerPreference: "high-performance"
        });
        const stage = host;
        const btn = host.querySelector(".btn-login") || host.querySelector(".liquid-button");
        const cv = host.querySelector(".liquid-fx");
        if (!gl || !btn) return;

        const P = {
          valFreq: 0.50, valAmp: 0.55, dens: 2.40, densVar: 2.20, densFreq: 0.32,
          wobAmp: 0.12, wobFreq: 1.60, lift: 0.05, refract: 0.18, edge: 0.04,
          width: 0.46, disp: 0.09, skew: 1.50, fineAmp: 0.0, fineFreq: 9.0,
          gamma: 1.00, gain: 1.90, octGain: 0.32, litLo: -0.26, litHi: 0.10, dim: 0.44
        };
        const PKEYS = Object.keys(P);
        const E = { base: 0.20, hot: 0.82, chromA: 0.14, chromS: 0.030, speed: 0.070, top: 0.35, press: 0.85, ripple: 1.60 };
        const EKEYS = Object.keys(E);
        const C = { glow: 1.95, glowR: 1.30, glowIn: 0.30, occl: 0.62, soften: 0.24, punch: 1.50 };
        const R = {
          speed: 1.85, width: 0.20, decay: 1.35, amp: 1.35, facet: 0.18, lobes: 6.0, sharp: 1.15, emit: 0.45,
          ptrRad: 0.55, ptrAmp: 0.32, ptrFast: 0.40, ptrRim: 0.80, ptrLag: 0.0016, ptrVref: 4.5
        };

        function sh(type, src) {
          const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); }
          return s;
        }
        function prog(fs) {
          const p = gl.createProgram();
          gl.attachShader(p, sh(gl.VERTEX_SHADER, VERT));
          gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
          gl.bindAttribLocation(p, 0, "position");
          gl.linkProgram(p);
          const u = {};
          const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
          for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name.replace("[0]", "")] = gl.getUniformLocation(p, info.name); }
          return { p, u };
        }
        const pScene = prog(FRAG_SCENE), pRim = prog(FRAG_RIM),
              pDown = prog(FRAG_DOWN), pBlur = prog(FRAG_BLUR), pComp = prog(FRAG_COMP);

        const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
        const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

        const hasFloat = !!gl.getExtension("EXT_color_buffer_half_float");
        function makeTarget() {
          const tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          const fbo = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
          return { tex, fbo, w: 0, h: 0 };
        }
        function sizeTarget(t, w, h) {
          if (t.w === w && t.h === h) return;
          t.w = w; t.h = h;
          gl.bindTexture(gl.TEXTURE_2D, t.tex);
          if (hasFloat) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
          else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        }
        const T_core = makeTarget(), T_rim = makeTarget(),
              T_s1 = makeTarget(), T_s2 = makeTarget(),
              T_a = makeTarget(), T_b = makeTarget();

        let W = 0, H = 0, DPR = 1, BW = 0, BH = 0, CX = 0, CY = 0;
        let DOWN = 4;
        const GLOW_TEX = 129;
        let needResize = true;

        function resize() {
          const r = stage.getBoundingClientRect();
          const br = btn.getBoundingClientRect();
          DPR = Math.min(window.devicePixelRatio || 1, 2);
          const w = Math.max(2, Math.round(r.width * DPR));
          const h = Math.max(2, Math.round(r.height * DPR));
          if (w !== W || h !== H) { W = w; H = h; cv.width = W; cv.height = H; }
          BW = br.width * DPR; BH = br.height * DPR;
          CX = (br.left - r.left) * DPR + BW / 2;
          CY = H - ((br.top - r.top) * DPR + BH / 2);
          sizeTarget(T_core, W, H); sizeTarget(T_rim, W, H);
          const hw = Math.max(2, Math.ceil(W / 2)), hh = Math.max(2, Math.ceil(H / 2));
          sizeTarget(T_s1, hw, hh); sizeTarget(T_s2, hw, hh);
          DOWN = Math.max(1, Math.min(4, Math.round(BH / GLOW_TEX)));
          const dw = Math.max(2, Math.ceil(W / DOWN)), dh = Math.max(2, Math.ceil(H / DOWN));
          sizeTarget(T_a, dw, dh); sizeTarget(T_b, dw, dh);
          needResize = false;
        }
        new ResizeObserver(() => { needResize = true; }).observe(stage);

        function drawTo(t) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, t ? t.fbo : null);
          gl.viewport(0, 0, t ? t.w : W, t ? t.h : H);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }

        const uArr = new Float32Array(PKEYS.length);
        const eArr = new Float32Array(EKEYS.length);
        let hover = 0, hoverTarget = 0, clock = 0, last = performance.now();

        const RIP = [0, 1, 2].map(() => ({ x: 0, y: 0, t: -99, on: 0 }));
        const ripArr = new Float32Array(12);
        let ripNext = 0, press = 0, pressTarget = 0;
        const ptr = { x: 0, y: 0 }, ptrS = { x: 0, y: 0 };
        let ptrAmt = 0, ptrSpeed = 0;

        function addRipple(x, y) {
          const r = RIP[ripNext];
          ripNext = (ripNext + 1) % RIP.length;
          r.x = x; r.y = y; r.t = clock; r.on = 1;
        }
        function localPt(e) {
          const b = btn.getBoundingClientRect(), s = b.height;
          return [(e.clientX - (b.left + b.width / 2)) / s, (e.clientY - (b.top + b.height / 2)) / s];
        }

        const calm = matchMedia("(prefers-reduced-motion: reduce)");
        let drawn = null;
        const IDLE_HZ = 30;
        let lastDraw = 0;

        function frame(now) {
          const dtRaw = (now - last) / 1000; last = now;
          const dt = Math.min(dtRaw, 1 / 20);
          if (!calm.matches) clock += dt;

          const k = hoverTarget > hover ? 1 - Math.pow(0.0012, dt) : 1 - Math.pow(0.00012, dt);
          hover += (hoverTarget - hover) * k;
          if (Math.abs(hoverTarget - hover) < 0.0008) hover = hoverTarget;

          const pk = pressTarget > press ? 1 - Math.pow(1e-9, dt) : 1 - Math.pow(0.004, dt);
          press += (pressTarget - press) * pk;
          if (Math.abs(pressTarget - press) < 0.002) press = pressTarget;

          for (let i = 0; i < RIP.length; i++) {
            const r = RIP[i];
            if (r.on && clock - r.t > 4) r.on = 0;
            ripArr[i * 4] = r.x; ripArr[i * 4 + 1] = r.y; ripArr[i * 4 + 2] = r.t; ripArr[i * 4 + 3] = r.on;
          }
          const ripLive = RIP.some(r => r.on);

          const lag = 1 - Math.pow(R.ptrLag, dt);
          const dx = (ptr.x - ptrS.x) * lag, dy = (ptr.y - ptrS.y) * lag;
          ptrS.x += dx; ptrS.y += dy;
          const inst = Math.min(Math.hypot(dx, dy) / Math.max(dt, 1e-3) / R.ptrVref, 1);
          ptrSpeed += (inst - ptrSpeed) * (1 - Math.pow(inst > ptrSpeed ? 0.001 : 0.02, dt));
          const wantWell = (on.over || on.press) ? 1 : 0;
          ptrAmt += (wantWell - ptrAmt) * (1 - Math.pow(0.004, dt));
          if (Math.abs(wantWell - ptrAmt) < 0.002) ptrAmt = wantWell;

          if (needResize) resize();

          const sig = (calm.matches && !ripLive && ptrAmt < 0.002) ? `${hover}|${press}|${W}|${H}` : null;
          if (sig !== null && sig === drawn) { requestAnimationFrame(frame); return; }
          drawn = sig;

          const idle = !on.over && !on.press && !on.focus && !ripLive
            && hover < 0.002 && press < 0.002 && ptrAmt < 0.002;
          if (idle && now - lastDraw < 1000 / IDLE_HZ) { requestAnimationFrame(frame); return; }
          lastDraw = now;

          for (let i = 0; i < uArr.length; i++) uArr[i] = P[PKEYS[i]];
          for (let i = 0; i < eArr.length; i++) eArr[i] = E[EKEYS[i]];
          const bw = Math.max(1.5, 3.2 * (BH / 516));

          gl.useProgram(pScene.p);
          gl.uniform2f(pScene.u.uC, CX, CY);
          gl.uniform2f(pScene.u.uHalf, BW / 2, BH / 2);
          gl.uniform1f(pScene.u.uT, clock);
          gl.uniform1f(pScene.u.uHover, hover);
          gl.uniform1f(pScene.u.uPress, press);
          gl.uniform4fv(pScene.u.uRip, ripArr);
          gl.uniform4f(pScene.u.uRipK, R.speed, R.width, R.decay, R.amp);
          gl.uniform4f(pScene.u.uRipK2, R.facet, R.lobes, R.sharp, R.emit);
          gl.uniform4f(pScene.u.uPtr, ptrS.x, ptrS.y, ptrAmt, ptrSpeed);
          gl.uniform4f(pScene.u.uPtrK, R.ptrRad, R.ptrAmp, R.ptrFast, R.ptrRim);
          gl.uniform1fv(pScene.u.uP, uArr);
          drawTo(T_core);

          gl.useProgram(pRim.p);
          gl.uniform2f(pRim.u.uC, CX, CY);
          gl.uniform2f(pRim.u.uHalf, BW / 2, BH / 2);
          gl.uniform1f(pRim.u.uT, clock);
          gl.uniform1f(pRim.u.uBw, bw);
          gl.uniform1f(pRim.u.uPress, press);
          gl.uniform4fv(pRim.u.uRip, ripArr);
          gl.uniform4f(pRim.u.uRipK, R.speed, R.width, R.decay, R.amp);
          gl.uniform4f(pRim.u.uRipK2, R.facet, R.lobes, R.sharp, R.emit);
          gl.uniform4f(pRim.u.uPtr, ptrS.x, ptrS.y, ptrAmt, ptrSpeed);
          gl.uniform4f(pRim.u.uPtrK, R.ptrRad, R.ptrAmp, R.ptrFast, R.ptrRim);
          gl.uniform1fv(pRim.u.uE, eArr);
          drawTo(T_rim);

          gl.useProgram(pDown.p);
          gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T_core.tex);
          gl.uniform1i(pDown.u.uTex, 0);
          gl.uniform1f(pDown.u.uAdd, 0);
          gl.uniform2f(pDown.u.uDstTexel, 1 / T_s1.w, 1 / T_s1.h);
          gl.uniform2f(pDown.u.uSrcTexel, 1 / W, 1 / H);
          drawTo(T_s1);

          gl.useProgram(pBlur.p);
          gl.uniform1i(pBlur.u.uTex, 0);
          gl.uniform2f(pBlur.u.uTexel, 1 / T_s1.w, 1 / T_s1.h);
          const sigTex = C.soften * (BH * 0.5) * 0.95;
          if (sigTex > 0.1) {
            const iters = Math.min(4, Math.max(1, Math.ceil(sigTex / 3.0)));
            gl.uniform1f(pBlur.u.uR, sigTex / Math.sqrt(iters) / 1.95);
            for (let i = 0; i < iters; i++) {
              gl.bindTexture(gl.TEXTURE_2D, T_s1.tex); gl.uniform2f(pBlur.u.uDir, 1, 0); drawTo(T_s2);
              gl.bindTexture(gl.TEXTURE_2D, T_s2.tex); gl.uniform2f(pBlur.u.uDir, 0, 1); drawTo(T_s1);
            }
          }

          gl.useProgram(pDown.p);
          gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T_s1.tex);
          gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, T_rim.tex);
          gl.uniform1i(pDown.u.uTex, 0);
          gl.uniform1i(pDown.u.uTex2, 1);
          gl.uniform1f(pDown.u.uAdd, 1);
          gl.uniform2f(pDown.u.uDstTexel, 1 / T_a.w, 1 / T_a.h);
          gl.uniform2f(pDown.u.uSrcTexel, 1 / T_s1.w, 1 / T_s1.h);
          drawTo(T_a);

          gl.useProgram(pBlur.p);
          gl.activeTexture(gl.TEXTURE0);
          gl.uniform1i(pBlur.u.uTex, 0);
          gl.uniform2f(pBlur.u.uTexel, 1 / T_a.w, 1 / T_a.h);
          const rs = C.glowR * (BH / DOWN) / GLOW_TEX;
          for (const r of [1.0, 2.3, 5.2, 9.0].map(v => v * rs)) {
            gl.uniform1f(pBlur.u.uR, r);
            gl.bindTexture(gl.TEXTURE_2D, T_a.tex); gl.uniform2f(pBlur.u.uDir, 1, 0); drawTo(T_b);
            gl.bindTexture(gl.TEXTURE_2D, T_b.tex); gl.uniform2f(pBlur.u.uDir, 0, 1); drawTo(T_a);
          }

          gl.useProgram(pComp.p);
          gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T_s1.tex); gl.uniform1i(pComp.u.uSoft, 0);
          gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, T_rim.tex); gl.uniform1i(pComp.u.uRim, 1);
          gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, T_a.tex); gl.uniform1i(pComp.u.uGlow, 2);
          gl.uniform2f(pComp.u.uRes, W, H);
          gl.uniform2f(pComp.u.uC, CX, CY);
          gl.uniform2f(pComp.u.uHalf, BW / 2, BH / 2);
          gl.uniform1f(pComp.u.uT, clock);
          gl.uniform4fv(pComp.u.uRip, ripArr);
          gl.uniform4f(pComp.u.uRipK, R.speed, R.width, R.decay, R.amp);
          gl.uniform4f(pComp.u.uRipK2, R.facet, R.lobes, R.sharp, R.emit);
          gl.uniform1f(pComp.u.uGlowGain, C.glow);
          gl.uniform1f(pComp.u.uGlowIn, C.glowIn);
          gl.uniform1f(pComp.u.uOccl, C.occl);
          gl.uniform1f(pComp.u.uDim, P.dim);
          gl.uniform1f(pComp.u.uPunch, C.punch);
          drawTo(null);

          requestAnimationFrame(frame);
        }

        const on = { over: false, press: false, focus: false };
        const sync = () => {
          hoverTarget = (on.over || on.press || on.focus) ? 1 : 0;
          pressTarget = on.press ? 1 : 0;
          stage.classList.toggle("hot", hoverTarget > 0.5);
          stage.classList.toggle("press", on.press);
        };

        btn.addEventListener("pointerenter", e => {
          if (e.pointerType !== "mouse") return;
          [ptr.x, ptr.y] = localPt(e);
          ptrS.x = ptr.x; ptrS.y = ptr.y; ptrSpeed = 0;
          on.over = true; sync();
        });
        btn.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") { on.over = false; sync(); } });
        window.addEventListener("pointermove", e => {
          if (!on.over && !on.press) return;
          [ptr.x, ptr.y] = localPt(e);
        }, { passive: true });
        btn.addEventListener("pointerdown", e => {
          [ptr.x, ptr.y] = localPt(e);
          on.press = true; sync();
          addRipple(ptr.x, ptr.y);
        });
        window.addEventListener("pointerup", () => { on.press = false; sync(); });
        window.addEventListener("pointercancel", () => { on.press = false; sync(); });
        btn.addEventListener("focus", () => { on.focus = btn.matches(":focus-visible"); sync(); });
        btn.addEventListener("blur", () => { on.focus = false; sync(); });
        btn.addEventListener("keydown", e => {
          if (e.key !== "Enter" && e.key !== " " || e.repeat) return;
          on.press = true; sync(); addRipple(0, 0);
        });
        btn.addEventListener("keyup", e => {
          if (e.key !== "Enter" && e.key !== " ") return;
          on.press = false; sync();
        });

        resize();
        requestAnimationFrame(frame);
      }

      document.querySelectorAll("[data-liquid-metal]").forEach(mountLiquidMetal);
    }

  </script>
</body>
</html>
